  on('sync-dot', 'dblclick', () => { if (confirm('Sign out of Doji?')) Login.signOut(); });

  // Banner and trade log
  onActivate('broker-banner', () => {
    const first = pending(Data.rows).sort(byKey)[0];
    if (first) Journal.open(first.id);
  });
  onActivate('trade-table', e => {
    const del = e.target.closest('[data-del]');
    if (del) { PendingDelete.stage(del.dataset.del); return; }
    const row = e.target.closest('tr[data-trade]');
    if (row) Journal.open(row.dataset.trade);
  });
  on('tlog-pagination', 'click', e => {
    const dir = e.target.closest('[data-page]')?.dataset.page;
    if (!dir) return;
    const pages = Math.ceil(Data.rows.length / CONFIG.PER_PAGE);
    View.page = Math.max(0, Math.min(pages - 1, View.page + (dir === 'next' ? 1 : -1)));
    renderTable(Data.rows);
  });

  // Journal modal. The form handler is bound HERE, once, not from
  // Journal.open(): #jm-body is persistent — only its innerHTML is replaced —
  // so binding per open stacks a listener each time, and after five opens one
  // click on Save fires five UPDATE round-trips, five renders and five toasts.
  // The handler is fully delegated, so the binding site is all that matters.
  on('jm-body', 'click', e => {
    const action = e.target.closest('[data-jm-action]')?.dataset.jmAction;
    if (action === 'save')   Journal.save();
    if (action === 'cancel') Journal.close();
  });
  on('journal-modal', 'click', e => { if (e.target.id === 'journal-modal') Journal.close(); });

  // Other modals
  on('day-close-btn', 'click', () => closeModal('day-modal'));
  on('day-modal',     'click', e => { if (e.target.id === 'day-modal') closeModal('day-modal'); });
  onActivate('day-trade-list', e => {
    const row = e.target.closest('[data-trade]');
    if (!row) return;
    closeModal('day-modal');
    Journal.open(row.dataset.trade);
  });

  // Toast undo
  on('notif', 'click', e => { if (e.target.closest('.notif-undo')) PendingDelete.undo(); });

  // Login
  on('login-btn', 'click', Login.submit);
  for (const id of ['login-email','login-pass'])
    on(id, 'keydown', e => { if (e.key === 'Enter') Login.submit(); });

  // Escape closes the topmost open thing.
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if ($('journal-modal').classList.contains('open')) Journal.close();
    else if ($('day-modal').classList.contains('open')) closeModal('day-modal');
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   BOOT
   ═══════════════════════════════════════════════════════════════════════════ */
// One writer, so the banner's three states cannot disagree with what happened.
function bootState(text, failed) {
  const el = $('boot-msg'), t = $('boot-text');
  if (!el) return;
  if (!text) { el.classList.add('done'); return; }
  if (t) t.textContent = text;
  el.classList.toggle('failed', !!failed);
  el.classList.remove('done');
}

/* Unreachable is not signed out. supabase-js answers a server it could not
   reach with the same `error` as a refusal, and offline the session check
   fails before the journal is asked for — so the cached copy is drawn
   read-only instead of the login screen, and the app boots properly when the
   network returns. */
const unreachable = e => e?.name === 'AuthRetryableFetchError';

function openOffline() {
  Data.cached();
  render();
  window.addEventListener('online', () => location.reload(), { once: true });
}

(async function boot() {
  // Both libraries are plain blocking scripts with no fallback. An unreachable
  // CDN leaves window.supabase undefined and Data.init() throws before anything
  // renders — unhandled, a blank page with the only explanation in a console
  // nobody has open on a phone.
  //
  // Supabase is fatal: it is the data. Chart.js is not — the heatmap, the log
  // and the roll-forward draw without it, and render() isolates each step, so
  // the app degrades to "no wheels" rather than refusing to start.
  if (!window.supabase) {
    bootState('Could not load the app. Check your connection and reload.', true);
    return;
  }
  if (!window.Chart) console.warn('Doji: Chart.js unavailable — charts will not draw');

  wire();

  DayWatcher.day = Dates.today();
  setInterval(DayWatcher.check, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) DayWatcher.check(); });
  window.addEventListener('focus', DayWatcher.check);

  let data, error;
  try {
    ({ data, error } = await Data.init());
  } catch (e) {
    console.error('Doji: init failed', e);
    bootState('Could not reach the server. Check your connection and reload.', true);
    return;
  }

  // The login overlay is its own full-screen surface, so the banner stands down
  // rather than sitting behind it.
  if (!data?.session) {
    bootState(null);
    if (unreachable(error)) openOffline(); else Login.show();
    return;
  }

  try {
    await Data.start();
    render();
    bootState(null);
    // Not awaited, and after the render on purpose: the journal is what this
    // page is for, and her three small reads must never sit in front of it.
    Watch.draw();
  } catch (e) {
    console.error('Doji: start failed', e);
    bootState(null);
    if (unreachable(e)) openOffline(); else Login.show();
  }
})();

</script>
</body>
</html>
