      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
    });
    const p = {};
    for (const part of fmt.formatToParts(date)) p[part.type] = part.value;
    return {
      y: +p.year, m: +p.month, d: +p.day, hour: +p.hour, minute: +p.minute,
      weekday: { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 }[p.weekday]
    };
  },

  // Used only where a row has no open_day of its own — an email-only fill the
  // poller never reached.
  nyDay(iso) {
    if (!iso) return null;
    return new Intl.DateTimeFormat('en-CA', {
      timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit'
    }).format(new Date(iso));
  },

  // Labelled ET, not NY: the neighbouring column uses NY as a session
  // abbreviation, so "21:05 NY" would read as a session claim.
  nyTime(iso) {
    if (!iso) return '';
    const p = Dates.nyParts(new Date(iso));
    return String(p.hour).padStart(2,'0') + ':' + String(p.minute).padStart(2,'0');
  },

  // Parsed at local noon so the string cannot shift a day in either direction
  // on the way to the formatter.
  fmt(day, opts) {
    if (!day) return DASH;
    return new Date(day + 'T12:00:00')
      .toLocaleDateString('en-GB', opts || { day:'2-digit', month:'short', year:'2-digit' });
  },

  today() {
    const p = Dates.nyParts(new Date());
    return `${p.y}-${String(p.m).padStart(2,'0')}-${String(p.d).padStart(2,'0')}`;
  },

  // The month the New York calendar is in, zero-based to match View.heatmap.
  // Both the opening position and the rollover target come from here, so the
  // grid can never open on a different month from the one a trade files under.
  nyMonth() {
    const p = Dates.nyParts(new Date());
    return { y: p.y, m: p.m - 1 };
  },

  // Gold trades Sunday 17:00 → Friday 17:00 New York. Returns the opening
  // Sunday as YYYY-MM-DD, so it compares directly against open_day.
  //
  // Sunday before 17:00 counts as the PREVIOUS week on purpose: the gap between
  // the Friday close and the Sunday open is when the week gets reviewed, and a
  // calendar-Sunday anchor would blank every figure at exactly that moment.
  weekStart(date = new Date()) {
    const p = Dates.nyParts(date);
    const back = (p.weekday === 0 && p.hour < 17) ? 7 : p.weekday;
    return new Date(Date.UTC(p.y, p.m - 1, p.d - back)).toISOString().slice(0, 10);
  },

  monthStart(date = new Date()) {
    const p = Dates.nyParts(date);
    return `${p.y}-${String(p.m).padStart(2,'0')}-01`;
  }
};

/* ─── DERIVE ─────────────────────────────────────────────────────────────────
   Four things every surface needs that are NOT stored, because storing them is
   what lets them drift. One function each, so the log, the wheels, the heatmap
   and the roll-forward cannot disagree about what a trade is.
   ─────────────────────────────────────────────────────────────────────────── */

// null when there is no P&L yet: a trade can be journalled before it closes,
// and a missing figure is not a break-even.
//
// The scratch test wants both prices, and the pre-sync rows have neither — for
// those the same $3 is read against P&L, which is the only measure they have
// ever had. Win and loss always come from the sign of the P&L: price distance is
// unsigned, and it is the account that decides which way a trade went.
const resultOf = t => {
  if (t.pnl == null) return null;
  const scratch = t.entry_price != null && t.exit_price != null
    ? Math.abs(t.exit_price - t.entry_price) <= CONFIG.BE
    : Math.abs(t.pnl) <= CONFIG.BE;
  // EXACTLY NOTHING MADE IS A BREAK-EVEN WHATEVER THE PRICE DID, and it is the
  // one case the price rule cannot reach: a trade can move sixty dollars and
  // still come back to zero once commission is in. The band is measured in
  // price because a band does not scale — $3 of P&L is $3 of gold at 0.01 lots
  // and three cents at 1.00 — and zero is the value that needs no scaling. It
  // is a point rather than a band, so this adds no dead zone to either rule.
  return scratch || t.pnl === 0 ? 'be' : t.pnl > 0 ? 'win' : 'loss';
};

// The same verdict over a SUM — a calendar day, a week cell, a month tile.
// Several trades have no single entry and exit between them, so a cell cannot
// measure price distance and inherits instead: it is a scratch when every
// decided trade inside it was one, OR when the trades inside it cancelled out
// exactly. `n` counts trades in the aggregate that actually carry a P&L, `be`
// how many of those were scratches; zero decided means there is nothing to
// judge and the cell takes no result colour.
//
// A total of exactly zero has no sign, so the sign rule below cannot answer it
// — and a day that ends precisely where it started went nowhere, which is what
// break-even means. Still no dead band: exactly zero is a point, so a day that
// nets a few dollars off two real losses is two real losses, as it always was.
const aggregateResult = (pnl, n, be) =>
  !n ? '' : be === n || pnl === 0 ? 'be' : pnl > 0 ? 'win' : 'loss';

// open_day when the poller supplied one, the New York civil day of the closing
// fill otherwise. Nothing else has a claim.
const dayOf = t => t.open_day || Dates.nyDay(t.fill_time);

// The entry instant's session, with the CLOSING instant as a last resort.
// Derived at read time, so it is never stale.
//
// That fallback is the "session seam" the README describes: fills the poller
// never reached have no entry_time, so their session comes from when they
// closed rather than when they opened. Imperfect and openly so — the
// alternative is returning nothing. Flag it whenever session data is read for a
// pattern spanning that boundary.
const sessionOf = t => {
  const at = t.entry_time || t.fill_time;
  return at ? Dates.session(new Date(at)) : null;
};

// Everything only the trader can answer: the setup and all three discipline
// questions. P&L is deliberately not required — an open position can be
// journalled before it closes.
const isComplete = t =>
  !!t.setup && t.followed_rules != null && t.followed_sl != null && t.followed_tp != null;

/* ─── STATS ──────────────────────────────────────────────────────────────── */
const round2 = v => Math.round(v * 100) / 100;

// The single definition of a win rate: taken over DECIDED trades, so a trade
// with no P&L is absent from both sides rather than counted as a loss.
function counts(list) {
  const out = { win: 0, loss: 0, be: 0, decided: 0, wr: 0 };
  for (const t of list) {
    const r = resultOf(t);
    if (r) out[r]++;
  }
  // Returned rather than recomputed by each caller — three need it.
  out.decided = out.win + out.loss + out.be;
  out.wr = out.decided ? (out.win / out.decided) * 100 : 0;
  return out;
}

// Gross profit, gross loss and net, split on the SIGN of each P&L rather than
// on the result label. That is what makes profit − loss come out exactly equal
// to net: every dollar lands on one side or the other, and a scratch is still a
// dollar even though it is not a win. The single definition of that split, so
// the P&L card, the day pop-up and the roll-forward cannot drift apart.
function money(list) {
  let gross = 0, loss = 0, n = 0;
  for (const t of list) {
    if (t.pnl == null) continue;
    n++;
    if (t.pnl >= 0) gross += t.pnl; else loss -= t.pnl;
  }
  return { n, gross: round2(gross), loss: round2(loss), net: round2(gross - loss) };
}

// On the RESULT LABEL, not the sign — the one place the two must differ. A
// scratch bucketed with the winners adds nothing to the numerator and a full
// one to the denominator, halving an average win that should read $57.
function averages(list) {
  let winSum = 0, winN = 0, lossSum = 0, lossN = 0;
  for (const t of list) {
    const r = resultOf(t);
    if (r === 'win')  { winSum  += t.pnl; winN++;  }
    if (r === 'loss') { lossSum -= t.pnl; lossN++; }
  }
  return {
    avgWin:  winN  ? round2(winSum  / winN)  : null,
    avgLoss: lossN ? round2(lossSum / lossN) : null
  };
}

// Whole-number percentages guaranteed to total 100 (largest remainder).
// Rounding each share independently gives 33/33/33 for three even thirds, and a
// strip reading 99% looks like a counting bug. Returns null when there is
// nothing to split, so callers show an em-dash rather than a misleading 0%.
function pctSplit(nums) {
  const total = nums.reduce((a, b) => a + b, 0);
  if (!total) return null;
  const exact = nums.map(v => v / total * 100);
  const out   = exact.map(Math.floor);
  const order = exact.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]);
  let rem = 100 - out.reduce((a, b) => a + b, 0);
  for (let k = 0; rem > 0; k++, rem--) out[order[k % out.length][1]]++;
  return out;
}

// WHEN A TRADE HAPPENED, and there is one answer. entry_time is the true
// execution instant and unique per trade; fill_time covers a row the poller
// never reached; the filing day is the last resort and collides across a day.
//
// It sits here rather than beside the trade log because latestBefore below is
// its first caller, and a definition under its own use is a forward reference
// waiting to become a load-order bug.
const sortKey = t => t.entry_time || t.fill_time || (dayOf(t) || '') + 'T00:00:00Z';

// The last value a broker column carried BEFORE a day — the day itself excluded,
// matching the half-open [start, end) ranges rangeStats uses, so
// latestBefore(rows, 'balance', monthStart) is the opening balance and
// latestBefore(rows, 'balance', nextMonthStart) closes the month. A null day
// means "no bound", i.e. the latest there is. One rule, so the P&L card and the
// roll-forward's two balance rows cannot answer the same question differently.
//
// Ordered on the true execution instant where there is one, since every trade on
// a day ties on the filing date alone — which is the whole reason this is a
// scan rather than a sort: the answer is one row, and finding it costs one pass.
//
// Two columns ask it — `balance` for the account the broker reported, `size_oz`
// for the size he last traded — so they cannot disagree about which row is
// latest.
function latestBefore(list, field, day = null) {
  let value = null, at = '';
  for (const t of list) {
    if (t[field] == null) continue;
    const d = dayOf(t);
    if (!d || (day && d >= day)) continue;
    const stamp = sortKey(t);
    if (stamp > at) { value = t[field]; at = stamp; }
  }
  return value;
}

/* ─── DATA ───────────────────────────────────────────────────────────────────
   Supabase is the data. There is no local write path to reconcile, so there is
   no shadow, no cursor, no tombstone bookkeeping and no conflict rule — a save
   is an UPDATE, and the next read returns what the database holds.

   The snapshot in localStorage is a READ CACHE and nothing more. It lets the
   journal open with no connection; it is never written back and can never be a
   source of truth.

   Trades arrive on their own: the poller and the email parser insert rows. The
   app only ever updates the journal columns of a row that already exists, so a
   trade the broker never saw cannot be logged, and no trade can be logged twice.
   ─────────────────────────────────────────────────────────────────────────── */
const Data = {
  sb: null,
  all: [],          // the table as loaded, deleted rows included
  rows: [],         // what renders: the live ones, derived from `all` by index()
  byId: new Map(),
  byDay: new Map(),
  offline: false,
  channel: null,
  refreshing: false,
  queued: false,     // a change landed mid-refresh; run one more pass after
  deferred: false,   // a change landed while a modal was open; flush on close

  // The definitive list. A save sends these and nothing else — the mechanism
  // that stops the app writing broker-owned data, enforced here rather than
  // trusted to each call site.
  OWNED: ['setup','followed_rules','followed_sl','followed_tp'],

  init() {
    this.sb = window.supabase.createClient(SUPABASE.URL, SUPABASE.KEY);
    return this.sb.auth.getSession();
  },

  // getUser() asks the auth server, load() asks PostgREST, and neither needs
  // the other's answer, so they overlap rather than queue. Before reordering:
  // the throw still lands before subscribe(), watch() and the caller's
  // render(), and an expired session fires a select that will be refused, which
  // load() catches into the snapshot.
  async start() {
    const [{ data, error }] = await Promise.all([this.sb.auth.getUser(), this.load()]);
    if (error || !data?.user) throw error || new Error('not authenticated');
    this.subscribe();
    this.watch();
  },

  // In pages, because PostgREST caps every answer at the project's Max rows,
  // and one read of a journal past it is a page that looks like the whole of
  // it. The walk stops on a short page, as the backup's does; ordered by the
  // key, or a range can put a row on two pages or none.
  async load() {
    try {
      const all = [];
      for (;;) {
        const { data, error } = await this.sb.from('trades').select('*')
          .order('id').range(all.length, all.length + CONFIG.READ_PAGE - 1);
        if (error) throw error;
        all.push(...data);
        if (data.length < CONFIG.READ_PAGE) break;
      }
      this.all = all;
      this.offline = false;
      try { localStorage.setItem(CONFIG.SNAPSHOT, JSON.stringify(this.all)); } catch (e) {}
      setSyncStatus('ok');
      this.index();
    } catch (e) {
      console.warn('Doji: load failed, using snapshot', e);
      this.cached();
    }
  },

  // The last thing the database confirmed, so it is safe to draw. Writes are
  // refused while offline, which is why nothing needs reconciling on return.
  // Two callers: a read the database did not answer, and a boot that could not
  // reach it to ask who was signed in.
  cached() {
    try { this.all = JSON.parse(localStorage.getItem(CONFIG.SNAPSHOT)) || []; }
    catch (err) { this.all = []; }
    this.offline = true;
    setSyncStatus('offline');
    this.index();
  },

  // One pass for both lookups, so renders run in O(trades) and the heatmap does
  // not rescan the set once per day drawn. `rows` is rebuilt here too, so every
  // writer edits `all` alone and the two cannot disagree.
  index() {
    this.rows = this.all.filter(t => !t.deleted);
    this.byId = new Map();
    this.byDay = new Map();
    for (const t of this.rows) {
      this.byId.set(t.id, t);
      const day = dayOf(t);
      if (!day) continue;
      let d = this.byDay.get(day);
      if (!d) { d = { list: [], pnl: 0, pnlN: 0, be: 0, pending: false }; this.byDay.set(day, d); }
      d.list.push(t);
      if (!isComplete(t)) d.pending = true;
      if (t.pnl != null) { d.pnl += t.pnl; d.pnlN++; if (resultOf(t) === 'be') d.be++; }
    }
    for (const d of this.byDay.values()) d.pnl = round2(d.pnl);
  },

  day(iso) { return this.byDay.get(iso) || EMPTY_DAY; },

  /* WHAT A REFUSED WRITE DOES, once. Logged for the console, said to him, and
     the dot goes red — three things that have to happen together and had to be
     remembered together in two places. The caller returns this directly, so a
     failed write reads as one line where it happens. */
  failed(verb, told, err) {
    console.error(`Doji: ${verb} failed`, err);
    notify(told, true);
    setSyncStatus('error');
    return false;
  },

  // NOT APPLIED LOCALLY FIRST: the dot carries the wait, and what comes back is
  // what replaces the row. `pnl` is a generated column, so the database is the
  // only thing that knows the figure — an optimistic write would have to invent
  // one and then correct it, which is a number changing under him for no reason
  // he can see.
  async save(id, fields) {
    if (this.offline) { notify('Offline — changes are not saved.', true); return false; }
    const patch = {};
    for (const k of this.OWNED) if (k in fields) patch[k] = fields[k];

    setSyncStatus('busy');
    const { data, error } = await this.sb
      .from('trades').update(patch).eq('id', id).select().single();
    if (error) return this.failed('save', 'Save failed — nothing was changed.', error);
    this.replace(data);
    setSyncStatus('ok');
    return true;
  },

  // Necessarily soft: the poller re-upserts every position inside its window,
  // so a hard delete is undone within two minutes. It never sends this column,
  // so the flag survives every later write.
  async remove(id) {
    if (this.offline) { notify('Offline — changes are not saved.', true); return false; }
    setSyncStatus('busy');
    const { error } = await this.sb.from('trades').update({ deleted: true }).eq('id', id);
    if (error) return this.failed('delete', 'Delete failed.', error);
    const row = this.all.find(t => t.id === id);
    if (row) row.deleted = true;
    this.index();
    setSyncStatus('ok');
    return true;
  },

  async restore(id) {
    const { data, error } = await this.sb
      .from('trades').update({ deleted: false }).eq('id', id).select().single();
    if (error) { console.error('Doji: restore failed', error); return false; }
    this.replace(data);
    return true;
  },

  /* Into `all`, which index() derives `rows` from: written anywhere else, the
     next index() would bring the pre-edit row back on screen. */
  replace(row) {
    const i = this.all.findIndex(t => t.id === row.id);
    if (i === -1) this.all.push(row); else this.all[i] = row;
    this.index();
  },

  /* Realtime is the fast path; refresh is the floor. Every websocket dies
     eventually — a phone backgrounding its tab kills it outright — and nothing
     replays what was missed, so the app also re-reads on foreground, on network
     return, and on a slow timer. Correctness lives in refresh. */
  subscribe() {
    if (this.channel) this.sb.removeChannel(this.channel);
    this.channel = this.sb.channel('doji')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'trades' },
          () => this.refresh())
      .subscribe(st => { if (st === 'SUBSCRIBED') this.refresh(); });
  },

  watch() {
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.refresh(); });
    window.addEventListener('focus',  () => this.refresh());
    window.addEventListener('online', () => this.refresh());
    window.addEventListener('pageshow', e => { if (e.persisted) this.refresh(); });
    setInterval(() => { if (!document.hidden) this.refresh(); }, 300000);
  },

  // A reload replaces the rendered set wholesale, pulling the ground out from
  // under half-typed input. Held, not dropped — Journal.close() flushes it.
  async refresh() {
    // A change arriving while a refresh is in flight is queued, not dropped:
    // the in-flight pass sets `queued` and runs exactly one more when it lands,
    // however many events piled up behind it. Dropping it would leave the panel
    // stale until the five-minute timer, which is a long time to show the wrong
    // numbers after a burst of poller upserts.
    if (this.refreshing) { this.queued = true; return; }
    if (modalOpen()) { this.deferred = true; return; }
    this.refreshing = true;
    try { await this.load(); render(); }
    finally {
      this.refreshing = false;
      if (this.queued) { this.queued = false; this.refresh(); }
    }
  },

  flushDeferred() {
    if (!this.deferred) return;
    this.deferred = false;
    this.refresh();
  }
};

const EMPTY_DAY = Object.freeze({ list: [], pnl: 0, pnlN: 0, be: 0, pending: false });

const modalOpen = () =>
  ['journal-modal','day-modal'].some(id => $(id)?.classList.contains('open'));

// One writer for the status dot, so the indicator cannot disagree with what the
// data layer did. Named setSyncStatus, not status: a top-level `function
// status()` in a classic script shadows the legacy Window.status attribute —
// same family of footgun as a global named `name`, `top` or `close`.
function setSyncStatus(state) {
  const el = $('sync-dot');
  if (!el) return;
  el.className = 'sync-dot ' + state;
  const text = { busy:'Syncing', ok:'Synced', offline:'Offline — read only', error:'Failed' }[state] || '';
  el.title = text;
  const lbl = el.querySelector('.sync-dot-label');
  if (lbl) lbl.textContent = text;
}
/* ═══════════════════════════════════════════════════════════════════════════
   CHARTS — the shared visual vocabulary

   Every wheel and every bar is built from one of the primitives below. A
   hand-rolled Chart config or new bar markup is how a page drifts apart from
   itself one component at a time.

     Result wheel        mountDonut(canvasId, [w, l, be])
     Figures under it    pctStrip(pctSplit([w, l, be]))
     Win/loss bars       sessionBars(list)        .sess-wr-*
     Compliance bars     disciplineBar(label, followed, n)
     Roll-forward rows   rollRow(label, cur, prev)
     Bar thickness       --bar-h                  (CSS)
     Wheel geometry      DONUT_CUTOUT, RESULT_FILL, RESULT_BORDER
   ═══════════════════════════════════════════════════════════════════════════ */

const cssToken = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// Read off the tokens rather than restated as literals, so the arcs, the CSS
// bar segments and the calendar cells cannot drift apart.
const RESULT_FILL   = Object.freeze([cssToken('--seg-win-bg'), cssToken('--seg-loss-bg'), cssToken('--seg-be-bg')]);
const RESULT_BORDER = Object.freeze([cssToken('--win'), cssToken('--loss'), cssToken('--seg-be-bd')]);
const SEG_BD        = parseFloat(cssToken('--seg-bd'));
const EMPTY_FILL    = cssToken('--seg-empty-bg');
const EMPTY_BORDER  = cssToken('--seg-empty-bd');
const DONUT_CUTOUT  = '68%';

// The equity curve's axis furniture. Chart.js cannot read a CSS variable, so
// these resolve here alongside the wheel palette — as literals they would be
// the one surface that ignores a palette change.
const CURVE_GRID = cssToken('--hair-2');
const CURVE_TICK = cssToken('--mt');
const MONO       = cssToken('--mono');

const charts = Object.create(null);

function destroyChart(id) {
  const c = charts[id];
  if (c) { c.destroy(); delete charts[id]; }
}

// counts = [wins, losses, break-evens]. An all-zero set draws a hollow
// placeholder ring rather than nothing, so an empty panel keeps its shape.
//
// An existing wheel is UPDATED, not rebuilt. render() runs on every realtime
// event, every tab focus and every five minutes, so tearing down nine Chart
// instances each time would be the most expensive thing the app does on a
// timer. The setup wheels are the exception — their host replaces its innerHTML
// and legitimately mints a new canvas, which is why the identity check is
// against the canvas and not the id.
function donutData(counts) {
  const has = counts.reduce((a, b) => a + b, 0) > 0;
  return {
    data:            has ? counts : [1],
    backgroundColor: has ? RESULT_FILL   : [EMPTY_FILL],
    borderColor:     has ? RESULT_BORDER : [EMPTY_BORDER],
    borderWidth:     has ? SEG_BD : 1
  };
}

function mountDonut(id, counts) {
  const canvas = $(id);
  if (!canvas) { destroyChart(id); return; }

  const existing = charts[id];
  if (existing && existing.canvas === canvas) {
    Object.assign(existing.data.datasets[0], donutData(counts));
    existing.update('none');
    return;
  }

  destroyChart(id);
  charts[id] = new Chart(canvas.getContext('2d'), {
    type: 'doughnut',
    data: { labels: ['W','L','B/E'], datasets: [donutData(counts)] },
    options: {
      responsive: false, cutout: DONUT_CUTOUT, animation: false,
      events: [],                                   // segments never light up on hover
      plugins: { legend: { display: false }, tooltip: { enabled: false } }
    }
  });
}

// The strip beneath a wheel is ALL rates and the wheel is ALL quantities. A
// percentage inside a ring of tallies is two mixed readings where there should
// be two clean ones.
//
// Both strips return SPANS ONLY. The grid laying them out lives on the host,
// emitted once by the shell and refilled per render — which is what keeps the
// canvas beside it stable and lets mountDonut reuse its Chart.
function pctStrip(pct) {
  const v = i => pct ? pct[i] + '%' : DASH;
  return `<span class="pm-lbl">Win Rate</span><span class="pm-val win">${v(0)}</span>`
       + `<span class="pm-lbl">Loss Rate</span><span class="pm-val loss">${v(1)}</span>`
       + `<span class="pm-lbl">BE Rate</span><span class="pm-val">${v(2)}</span>`;
}

// Same primitives as the percentage strip, one more column, and the figures
// carry a sign so setFigure can colour them.
function moneyStrip(key) {
  return `<span class="pm-lbl">Win Rate</span><span class="pm-val" id="pm-wr-${key}">—</span>`
       + `<span class="pm-lbl">Profit</span><span class="pm-val" id="pm-p-${key}">—</span>`
       + `<span class="pm-lbl">Loss</span><span class="pm-val" id="pm-l-${key}">—</span>`
       + `<span class="pm-lbl">Net</span><span class="pm-val" id="pm-n-${key}">—</span>`;
}

/* One result wheel with its tallies and figure strip. The period columns and
   the setup columns are the same component at two populations, so it is defined
   once here. `key` gives every part a stable id: the shell runs once, so the
   canvas survives each render and the Chart behind it is updated rather than
   rebuilt. */
function wheelBlock(key, stripHTML, stripCls) {
  return `
    <div class="period-host">
      <div class="period-counts-left">
        <span class="pc-b" id="cnt-b-${key}">— B</span>
        <span class="pc-l" id="cnt-l-${key}">— L</span>
      </div>
      <div class="period-donut-wrap">
        <canvas id="chart-${key}" width="108" height="108"></canvas>
        <div class="period-center"><div class="period-pnl" id="hub-${key}">—</div></div>
      </div>
      <div class="period-counts-right">
        <span class="pc-w" id="cnt-w-${key}">— W</span>
      </div>
      <div class="period-money ${stripCls}" id="strip-${key}">${stripHTML}</div>
    </div>`;
}

// The counterpart to wheelBlock. The hub carries a QUANTITY — the decided total
// the arcs are drawn from — while the strip beside it carries rates.
function paintWheel(key, c) {
  const set = (id, txt) => { const el = $(id); if (el) el.textContent = txt; };
  set('hub-'   + key, c.decided || DASH);
  set('cnt-w-' + key, c.win  + ' W');
  set('cnt-l-' + key, c.loss + ' L');
  set('cnt-b-' + key, c.be   + ' B');
  mountDonut('chart-' + key, [c.win, c.loss, c.be]);
}

// Every horizontal bar: proportional widths, the last visible segment tagged so
// it rounds off the track, a solo segment rounded both ends.
function segments(parts) {
  const segs = parts.filter(p => p.v > 0)
    .map(p => `<div class="${p.cls}" style="width:${p.v}%"></div>`);
  if (!segs.length) return { html: '', track: 'solo' };
  const last = segs.length - 1;
  const html = segs.map((s, i) =>
    i === last ? s.replace('class="sess-wr-seg', 'class="sess-wr-seg-last sess-wr-seg') : s
  ).join('');
  return { html, track: segs.length === 1 ? 'solo' : 'first' };
}

// The denominator is trades where the question was ANSWERED. Every broker fill
// arrives with all three blank, so counting a blank as a miss lets an entry
// nobody got round to depress every rate it touches.
function disciplineBar(label, followed, n) {
  if (!n) {
    return `
      <div class="period-disc-row">
        <div class="period-disc-head">
          <span class="period-disc-lbl">${label}</span>
          <span class="period-disc-pct dim">—</span>
        </div>
        <div class="bar-empty"></div>
      </div>`;
  }
  const pct = Math.round(followed / n * 100);
  const { html, track } = segments([
    { cls: 'sess-wr-seg-win',  v: followed / n * 100 },
    { cls: 'sess-wr-seg-loss', v: (n - followed) / n * 100 }
  ]);
  return `
    <div class="period-disc-row">
      <div class="period-disc-head">
        <span class="period-disc-lbl">${label}</span>
        <span class="period-disc-pct ${pct >= 50 ? 'win' : 'loss'}">${pct}%</span>
      </div>
      <div class="sess-wr-track ${track}" title="${followed}/${n} followed">${html}</div>
    </div>`;
}

// EVERY session renders — a dim placeholder rather than a dropped row, because
// the setup columns are flex:1 with space-between and dropping one makes the
// survivors stretch.
function sessionBars(list) {
  // Bucketed once rather than filtered per session. `sessionOf` is the
  // expensive read here — four timezone lookups a trade — and asking it five
  // times for every row is five times the work for one answer that cannot
  // change between passes.
  const bucket = new Map(CONFIG.SESSIONS.map(s => [s, []]));
  for (const t of list) bucket.get(sessionOf(t))?.push(t);

  const rows = CONFIG.SESSIONS.map(s => {
    const c = counts(bucket.get(s));
    const decided = c.decided;
    const abbr = CONFIG.SESSION_ABBR[s];
    if (!decided) {
      return `
        <div class="sess-wr-row">
          <div class="sess-wr-label">${abbr}</div>
          <div class="bar-empty"></div>
          <div class="sess-wr-pct dim">—</div>
        </div>`;
    }
    const wr = Math.round(c.wr);
    const { html, track } = segments([
      { cls: 'sess-wr-seg-win',  v: c.win  / decided * 100 },
      { cls: 'sess-wr-seg-be',   v: c.be   / decided * 100 },
      { cls: 'sess-wr-seg-loss', v: c.loss / decided * 100 }
    ]);
    return `
      <div class="sess-wr-row">
        <div class="sess-wr-label">${abbr}</div>
        <div class="sess-wr-track ${track}" title="${c.win}W · ${c.loss}L · ${c.be}B (${decided} trades)">${html}</div>
        <div class="sess-wr-pct ${wr >= 50 ? 'win' : 'loss'}">${wr}%</div>
      </div>`;
  }).join('');
  return `<div class="sess-wr-list">${rows}</div>`;
}

// Each cell is [text, sign]. The sign is passed rather than read off the text
// because it is not always recoverable — gross loss prints unsigned and still
// colours red.
const DASH = '—';
function rollRow(label, cur, prev, cls) {
  return `<div class="roll-row${cls ? ' ' + cls : ''}">`
       + `<span class="pnl-stat-lbl">${label}</span>`
       + rollCell(cur) + rollCell(prev) + `</div>`;
}
function rollCell([text, sign]) {
  const c = sign > 0 ? ' win' : sign < 0 ? ' loss' : '';
  const d = text === DASH ? ' dim' : '';
  return `<span class="pnl-stat-val${c}${d}">${text}</span>`;
}

// Printed unsigned; the sign lives in the colour. One formatter, so a figure
// and its colour cannot come from two different numbers.
const fmtMoney = v => Math.abs(round2(v)).toFixed(2);

// The other direction: a figure that carries its own sign, for the two places a
// P&L is read as a number in a list rather than as a coloured total. A leading
// `+` only above zero — a negative already prints one and a flat trade is not a
// gain — which is why this cannot be `fmtMoney` with a sign glued on.
//
// NO `round2` HERE, deliberately, where fmtMoney has one. These read `t.pnl`
// straight off the row rather than a total this file computed, and rounding a
// column the app does not own would make it print something the database does
// not say. The two rules are not the same rule and are not being merged.
const fmtSigned = v => (v > 0 ? '+' : '') + v.toFixed(2);

function setFigure(id, text, sign) {
  const el = $(id);
  if (!el) return;
  el.textContent = text;
  el.classList.remove('win','loss');
  if (sign) el.classList.add(sign > 0 ? 'win' : 'loss');
}

const setupAbbr = s => String(s).trim().split(/\s+/)
  .map(w => w === '&' ? '&' : w.charAt(0).toUpperCase()).join('');

// A pair everywhere a setup appears, so the phone stylesheet swaps which span
// is visible and the two cannot drift.
const setupCell = s => !s ? DASH
  : `<span class="setup-full">${esc(s)}</span><span class="setup-abbr">${esc(setupAbbr(s))}</span>`;

// Oldest first. Ties return 0 rather than falling through to "greater": two
// pre-poller rows filed on the same day share a key, and a comparator that
// never reports equality lets them swap places between renders.
const byKey = (a, b) => {
  const x = sortKey(a), y = sortKey(b);
  return x < y ? -1 : x > y ? 1 : 0;
};

/* ═══════════════════════════════════════════════════════════════════════════
   RENDER — one function per component

   render() orchestrates and draws nothing itself. Each step runs in isolation so
   one widget can degrade without blanking the panel — if the chart library failed
   to load, the heatmap and the trade log still draw.
   ═══════════════════════════════════════════════════════════════════════════ */

const View = {
  page: 0,
  heatmap: Dates.nyMonth()
};

function render() {
  const rows = Data.rows;
  const steps = [
    () => renderBanner(rows),
    () => renderPnLCard(rows),
    () => renderCurve(rows),
    () => renderPeriods(rows),
    () => renderHeatmap(),
    () => renderSetups(rows),
    () => renderRollForward(rows),
    () => renderTable(rows)
  ];
  for (const step of steps) {
    try { step(); } catch (err) { console.error('Doji: render step failed', err); }
  }
  try { Carousel.refresh(); } catch (err) { console.error('Doji: carousel failed', err); }
}

/* ─── Broker banner ──────────────────────────────────────────────────────── */
function pending(rows) { return rows.filter(t => !isComplete(t)); }

function renderBanner(rows) {
  const el = $('broker-banner');
  if (!el) return;
  const n = pending(rows).length;
  if (!n) { el.style.display = 'none'; return; }
  el.innerHTML = `<b>${n}</b> New trade${n > 1 ? 's' : ''} synced from your broker. `
               + `Fill in the setup &amp; rules data.`
               + `<span class="broker-banner-cta">Open entry →</span>`;
  el.style.display = 'flex';
}

/* ─── P&L card ───────────────────────────────────────────────────────────── */
// Money, not a percentage between them: a rate hides the size of what moved —
// +200% off a $2 week and a $200 week are the same number — and breaks outright
// when the prior period is zero.
function renderPnLCard(rows) {
  const wk    = Dates.weekStart();
  const wkPrev = prevWeek(wk);
  const mo    = Dates.monthStart();
  const moPrev = shiftMonth(mo, -1);

  // Plain sums, no sign split. Everything that needs one comes from money().
  const m = money(rows);
  let week = 0, weekWas = 0, month = 0, monthWas = 0;
  for (const t of rows) {
    if (t.pnl == null) continue;
    const d = dayOf(t);
    if (!d) continue;
    if      (d >= wk)     week    += t.pnl;
    else if (d >= wkPrev) weekWas += t.pnl;
    if      (d >= mo)     month    += t.pnl;
    else if (d >= moPrev) monthWas += t.pnl;
  }

  const balance = latestBefore(rows, 'balance');
  const oz      = latestBefore(rows, 'size_oz');
  $('pnl-balance-number').textContent = balance == null ? DASH : balance.toFixed(2);
  /* PRECEDENCE, AND IT IS NOT ARBITRARY. The awaiting notice explains the dash
     directly above it; the sizing line is an unrelated fact that would leave
     that dash unexplained. A caption belongs to the figure it sits under, so
     the notice wins whenever there is one and the sizing fills the space it
     leaves. Both absent is empty, which :empty already hides. */
  $('pnl-balance-at').textContent =
    balance == null ? 'awaiting a synced fill'
    : oz == null    ? ''
    : `${(oz / 100).toFixed(2)} lots — sizing for ${Math.round(oz * 500)}`;
  $('pnl-net-count').textContent      = m.n || '';

  setFigure('pnl-net-number',   m.n ? fmtMoney(m.net)   : DASH, m.net);
  setFigure('pnl-gross-profit', m.n ? fmtMoney(m.gross) : DASH, m.gross);
  setFigure('pnl-gross-loss',   m.n ? fmtMoney(m.loss)  : DASH, -m.loss);

  for (const [id, v] of [['pnl-week-prev', weekWas], ['pnl-week-cur', week],
                         ['pnl-month-prev', monthWas], ['pnl-month-cur', month]]) {
    const amt = round2(v);
    setFigure(id, m.n ? fmtMoney(amt) : DASH, m.n ? amt : 0);
  }
}

// Built and formatted in UTC, so nothing shifts across a timezone on the round
// trip.
function prevWeek(day) {
  const [y, m, d] = day.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d - 7)).toISOString().slice(0, 10);
}
function shiftMonth(day, by) {
  const [y, m] = day.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1 + by, 1)).toISOString().slice(0, 10);
}

/* ─── Cumulative curve ───────────────────────────────────────────────────── */
function renderCurve(rows) {
  const canvas = $('chart-pnl');
  if (!canvas) { destroyChart('chart-pnl'); return; }

  const pts = rows.filter(t => t.pnl != null).sort(byKey);
  if (!pts.length) {
    destroyChart('chart-pnl');
    canvas.getContext('2d')?.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }

  const labels = [], data = [];
  let cum = 0;
  for (const t of pts) {
    cum += t.pnl;
    labels.push(Dates.fmt(dayOf(t), { day:'2-digit', month:'short' }));
    data.push(round2(cum));
  }

  // The line takes the colour of where the curve ended up.
  const line = data[data.length - 1] >= 0 ? cssToken('--win') : cssToken('--loss');

  // Static markup, so the same element on every pass and the chart is built
  // once.
  const existing = charts['chart-pnl'];
  if (existing) {
    existing.data.labels = labels;
    Object.assign(existing.data.datasets[0], {
      data, borderColor: line, pointBackgroundColor: line, pointBorderColor: line,
      pointRadius: data.length > 20 ? 0 : 2
    });
    existing.update('none');
    return;
  }

  charts['chart-pnl'] = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: { labels, datasets: [{
      data, borderColor: line, borderWidth: 1.5,
      pointRadius: data.length > 20 ? 0 : 2,
      pointBackgroundColor: line, pointBorderColor: line,
      fill: false, tension: 0.3
    }]},
    options: {
      responsive: true, maintainAspectRatio: false, resizeDelay: 0, animation: false,
      layout: { padding: { top: 4, right: 4, bottom: 0, left: 0 } },
      plugins: { legend: { display: false }, tooltip: { enabled: false } },
      scales: {
        x: { display: false },
        y: {
          // Bounded to the data's own range rather than forced through zero: a
          // curve between 500 and 600 should use the full height, not flatten
          // against the top of a 0–600 axis.
          grace: '8%',
          border: { display: false },
          grid: { color: CURVE_GRID, drawTicks: false },
          ticks: {
            color: CURVE_TICK,
            font: { family: MONO, size: 8 },
            maxTicksLimit: 4, padding: 6
          }
        }
      }
    }
  });
}

/* ─── Period wheels ──────────────────────────────────────────────────────────
   All Time / This Week / This Month — three identical columns, generated from
   CONFIG.PERIODS, so a fourth window is one array entry rather than markup in
   three places and twelve new ids.

   The shell runs ONCE, like heatmapShell: a canvas that survives the render is a
   Chart that can be updated instead of rebuilt.
   ─────────────────────────────────────────────────────────────────────────── */
function periodStart(period) {
  if (period === 'week')  return Dates.weekStart();
  if (period === 'month') return Dates.monthStart();
  return null;
}

function periodShell() {
  const host = $('period-row');
  if (!host || host.dataset.ready) return;
  host.innerHTML = CONFIG.PERIODS.map(({ key, label }) => `
    <div class="period-col" data-period="${key}">
      <div class="period-label">${label}</div>
      <div class="period-rr" id="rr-bar-${key}"></div>
      ${wheelBlock(key, moneyStrip(key), '')}
      <div class="period-disc" id="disc-bars-${key}"></div>
    </div>`).join('');
  host.dataset.ready = '1';
}

function renderPeriods(rows) {
  periodShell();
  for (const { key } of CONFIG.PERIODS) {
    const from = periodStart(key);
    const list = from ? rows.filter(t => { const d = dayOf(t); return d && d >= from; }) : rows;

    const c   = counts(list);
    const pct = pctSplit([c.win, c.loss, c.be]);

    // The hub is not the money rows' count: a trade logged without a figure is
    // a slice on the wheel but not a dollar below.
    const m = money(list);
    setFigure('pm-wr-' + key, pct ? pct[0] + '%' : DASH, pct ? 1 : 0);
    setFigure('pm-p-'  + key, m.n ? fmtMoney(m.gross) : DASH, m.gross);
    setFigure('pm-l-'  + key, m.n ? fmtMoney(m.loss)  : DASH, -m.loss);
    setFigure('pm-n-'  + key, m.n ? fmtMoney(m.net)   : DASH, m.net);

    const rr = $('rr-bar-' + key);
    if (rr) rr.innerHTML = rrBar(list);

    const disc = $('disc-bars-' + key);
    if (disc) disc.innerHTML = disciplineBars(list);

    // Wheel last, deliberately: render() catches per STEP, not per widget, so a
    // chart library that failed to load must not take the figures with it.
    paintWheel(key, c);
  }
}

// The three compliance bars for any list — the same computation the during-
// trade card and the Positive column run over a different population.
//
// Two of the three bias upward, and the bar cannot show it: followed_sl and
// followed_tp are answered at open, so they record intent, and a missed later
// edit reads as compliance. A high stop bar is a claim about answering as much
// as about discipline.
function disciplineBars(list) {
  const bar = (label, key) => {
    const answered = list.filter(t => t[key] != null);
    return disciplineBar(label, answered.filter(t => t[key] === true).length, answered.length);
  };
  return bar('Rules', 'followed_rules') + bar('Stop Loss', 'followed_sl') + bar('Take Profit', 'followed_tp');
}

/* ─── R:R bar ────────────────────────────────────────────────────────────────
   Realised, not planned: average win over average loss from closed P&L. The
   plan is on a row only as the poller first saw it, and only on the trades
   since it began recording one, so a planned ratio is not computed here.

   The same head and track as disciplineBar, so the row above the wheel and the
   three below it are one component carrying different figures. Per period, not
   once for the account: the whole point of the row is that a window can be read
   against the windows either side of it.
   ─────────────────────────────────────────────────────────────────────────── */
function rrBar(list) {
  const { avgWin, avgLoss } = averages(list);
  // Under the track, not over it: the column's own "This Month" heading sits
  // directly above, and two labels on consecutive lines read as one confused one.
  //
  // The figure takes the LABEL's class, not a figure class. It is the only grey
  // number in a column whose other three figures are green or red, so at the
  // brighter figure tone it read as the loudest thing in the box. Carrying the
  // label's own rule rather than a copy of its size and colour is what keeps the
  // two ends of this row identical when either is retuned.
  const head = fig => `
      <div class="period-disc-head">
        <span class="period-disc-lbl">RR Ratio</span>
        <span class="period-disc-lbl">${fig}</span>
      </div>`;

  if (avgWin === null && avgLoss === null) {
    return `<div class="period-disc-row"><div class="bar-empty"></div>${head(DASH)}</div>`;
  }

  /* No losses means no ratio, only a direction: the figure caps rather than
     dividing by zero. avgLoss is never zero — a loss is past the scratch band —
     and both-null returned above, so a falsy avgLoss here means wins alone. */
  const RR_CAP = 9.99;
  const ratio = avgLoss ? (avgWin || 0) / avgLoss : RR_CAP;
  const total = ratio + 1;
  const { html, track } = segments([
    { cls: 'sess-wr-seg-win',  v: ratio / total * 100 },
    { cls: 'sess-wr-seg-loss', v: 1     / total * 100 }
  ]);
  return `
    <div class="period-disc-row">
      <div class="sess-wr-track ${track}" title="avg win $${fmtMoney(avgWin || 0)} / avg loss $${fmtMoney(avgLoss || 0)}">${html}</div>
      ${head(ratio.toFixed(2) + ':1')}
    </div>`;
}

/* ─── Heatmap ────────────────────────────────────────────────────────────── */
function heatmapShell() {
  const host = $('calendar-heatmap');
  if (!host || host.dataset.ready) return;
  host.innerHTML = `
    <div class="heatmap-hdr">
      <button id="heatmap-prev" class="heatmap-nav-btn">&larr;</button>
      <span id="heatmap-title" class="heatmap-title"></span>
      <button id="heatmap-next" class="heatmap-nav-btn">&rarr;</button>
    </div>
    <div id="heatmap-month-pnl" class="heatmap-month-pnl">
      <span class="heatmap-month-stat"><span class="pm-lbl">Profit</span><span class="pm-val" id="hm-profit">—</span></span>
      <span class="heatmap-month-stat"><span class="pm-lbl">Loss</span><span class="pm-val" id="hm-loss">—</span></span>
      <span class="heatmap-month-stat"><span class="pm-lbl">Net</span><span class="pm-val" id="hm-net">—</span></span>
      <span class="heatmap-month-stat"><span class="pm-lbl">Trades</span><span class="pm-val" id="hm-trades">—</span></span>
    </div>
    <div id="heatmap-year" class="heatmap-year"></div>
    <div id="heatmap-grid" class="heatmap-grid"></div>`;
  host.dataset.ready = '1';

  on('heatmap-prev', 'click', () => { stepMonth(-1); renderHeatmap(); });
  on('heatmap-next', 'click', () => { stepMonth( 1); renderHeatmap(); });
  // Delegated on the containers, which survive re-renders.
  onActivate('heatmap-grid', e => {
    const cell = e.target.closest('.heatmap-cell[data-day]');
    if (cell) openDay(cell.dataset.day);
  });
  onActivate('heatmap-year', e => {
    const cell = e.target.closest('.hm-mo[data-month]');
    if (!cell) return;
    View.heatmap.m = Number(cell.dataset.month);
    renderHeatmap();
  });
}

function stepMonth(dir) {
  const h = View.heatmap;
  h.m += dir;
  if (h.m > 11) { h.m = 0;  h.y++; }
  if (h.m < 0)  { h.m = 11; h.y--; }
}

// One pass. `trades` counts every row filed in the month; everything else is
// money()'s, so the strip checks against the day cells summing into it and the
// profit rule is not restated here.
function yearTotals(y) {
  const buckets = Array.from({ length: 12 }, () => ({ trades: 0, list: [] }));
  const prefix = String(y) + '-';
  for (const t of Data.rows) {
    const d = dayOf(t);
    if (!d || !d.startsWith(prefix)) continue;
    const b = buckets[Number(d.slice(5, 7)) - 1];
    b.trades++;
    if (t.pnl != null) b.list.push(t);
  }
  return buckets.map(b => {
    const m = money(b.list);
    return { trades: b.trades, pnlN: m.n, be: counts(b.list).be,
             gross: m.gross, loss: m.loss, net: m.net };
  });
}

/* Three jobs: read the month, lay out the grid, write the totals. */

// Up front, because the Saturday decision needs the counts before the grid can
// be laid out and the cells need them again while emitting.
function heatmapDays(y, m) {
  const daysIn = new Date(y, m + 1, 0).getDate();
  const days = [];
  let satTrades = 0, peak = 0;
  for (let d = 1; d <= daysIn; d++) {
    const iso = `${y}-${String(m + 1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const wd  = new Date(y, m, d).getDay();
    const data = Data.day(iso);
    days.push({ d, iso, wd, data });
    if (wd === 6) satTrades += data.list.length;
    // The magnitude bars are scaled to the biggest day in THIS month, so a width
    // answers "how does this day compare with my month" rather than "with the
    // loudest day I ever had".
    if (data.pnlN) peak = Math.max(peak, Math.abs(data.pnl));
  }
  return { days, satTrades, peak };
}

// A day's or a week's count, the word in its own span so the phone drops it.
const tradeCount = n =>
  n ? `${n}<span class="heatmap-cell-count-word"> trade${n > 1 ? 's' : ''}</span>` : '';

// Week by week: `cols` day slots then that week's summary. `slot` counts
// positions rather than dates, so the summary lands in the last column
// whichever weekday the month opens on.
function heatmapGrid(visible, cols, first, dows, peak) {
  const today = Dates.today();
  let html = dows.map((d, i) => `<div class="heatmap-dow${i === 6 ? ' heatmap-dow-closed' : ''}">${d}</div>`).join('')
           + '<div class="heatmap-dow heatmap-dow-week">Week</div>';

  let slot = 0, wkN = 0, wkPnl = 0, wkPnlN = 0, wkBe = 0, wkTrades = 0;

  const flushWeek = () => {
    wkN++;
    const cls   = wkTrades === 0 ? '' : aggregateResult(wkPnl, wkPnlN, wkBe);
    const abs   = fmtMoney(wkPnl);
    // Separate spans so the phone stylesheet can drop the tail.
    const pnl   = wkPnlN ? `$${abs.slice(0, -3)}<span class="hm-cents">${abs.slice(-3)}</span>`
                : wkTrades ? DASH : '';
    html += `
      <div class="heatmap-week ${cls}">
        <div class="heatmap-week-lbl">W${wkN}</div>
        <div class="heatmap-week-count">${tradeCount(wkTrades)}</div>
        <div class="heatmap-week-pnl">${pnl}</div>
      </div>`;
    wkPnl = 0; wkPnlN = 0; wkBe = 0; wkTrades = 0;
  };
  const blank = () => { html += '<div class="heatmap-cell-empty"></div>'; slot++; };

  // To the first visible day's column, not to the 1st — a month can open on a
  // dropped Saturday.
  for (let i = 0; i < (visible.length ? visible[0].wd : first); i++) blank();

  for (const { d, iso, data } of visible) {
    const n = data.list.length;
    // A result fill whether or not a P&L is logged: the day happened, so it
    // keeps its place in the colour rhythm. Only the AMOUNT waits for a figure.
    let cls = n === 0 ? '' : aggregateResult(data.pnl, data.pnlN, data.be);
    if (data.pending) cls += ' pending';
    if (iso === today) cls += ' today';

    const pnlText   = data.pnlN ? '$' + fmtMoney(data.pnl) : n ? DASH : '';
    // Focusable only when the cell opens something, or thirty-one tab stops sit
    // in front of the trade log.
    const opens = n ? ` role="button" tabindex="0" aria-label="${iso}"` : '';
    // Only a cell carrying a P&L takes a result colour, so only a cell carrying
    // one needs the intensity the colour is mixed at.
    const intensity = data.pnlN && peak
      ? ` style="--hm-i:${round2(0.4 + 0.6 * Math.abs(data.pnl) / peak)}"` : '';

    html += `
      <div class="heatmap-cell ${cls}" data-day="${iso}"${opens}${intensity}>
        <div class="heatmap-cell-day">${d}</div>
        <div class="heatmap-cell-body">
          <div class="heatmap-cell-count">${tradeCount(n)}</div>
          <div class="heatmap-cell-pnl">${pnlText}</div>
        </div>
      </div>`;

    if (n) { wkTrades += n; wkPnlN += data.pnlN; wkPnl += data.pnl; wkBe += data.be; }
    slot++;
    if (slot % cols === 0) flushWeek();
  }
  if (slot % cols !== 0) {
    while (slot % cols !== 0) blank();
    flushWeek();
  }
  return html;
}

function renderHeatmap() {
  heatmapShell();
  const cur = View.heatmap;
  const title = $('heatmap-title');
  if (title) title.textContent = `${CONFIG.MONTHS[cur.m]} ${cur.y}`;

  const totals = yearTotals(cur.y);
  renderYearStrip(cur.y, cur.m, totals);

  const { days, satTrades, peak } = heatmapDays(cur.y, cur.m);

  // Saturday never trades, so on a phone it hands its width to the six that do.
  // Dropped only when genuinely empty — a trade mis-stamped there must never
  // become invisible and unclickable.
  const showSat = !Phone.matches || satTrades > 0;
  const visible = showSat ? days : days.filter(x => x.wd !== 6);
  const cols    = showSat ? 7 : 6;
  const dows    = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].slice(0, cols);

  const grid = $('heatmap-grid');
  if (grid) {
    grid.classList.toggle('no-sat', !showSat);
    grid.innerHTML = heatmapGrid(visible, cols, new Date(cur.y, cur.m, 1).getDay(), dows, peak);
  }

  const m = totals[cur.m];
  setFigure('hm-profit', m.pnlN ? fmtMoney(m.gross) : DASH, m.gross);
  setFigure('hm-loss',   m.pnlN ? fmtMoney(m.loss)  : DASH, -m.loss);
  setFigure('hm-net',    m.pnlN ? fmtMoney(m.net)   : DASH, m.net);
  setFigure('hm-trades', m.trades ? String(m.trades) : DASH, 0);
}

function renderYearStrip(y, selMonth, totals) {
  const host = $('heatmap-year');
  if (!host) return;
  host.innerHTML = totals.map((t, m) => {
    const cls = ['hm-mo'];
    if (t.trades) cls.push(aggregateResult(t.net, t.pnlN, t.be));
    if (m === selMonth) cls.push('sel');
    const pnl = t.pnlN ? '$' + fmtMoney(t.net) : (t.trades ? DASH : '');
    return `
      <div class="${cls.join(' ')}" data-month="${m}" role="button" tabindex="0"
           aria-label="${CONFIG.MONTHS_ABBR[m]} ${y}">
        <div class="hm-mo-lbl">${CONFIG.MONTHS_ABBR[m]}</div>
        <div class="hm-mo-count">${t.trades || ''}</div>
        <div class="hm-mo-pnl">${pnl}</div>
      </div>`;
  }).join('');
}

/* ─── Setups ─────────────────────────────────────────────────────────────────
   One wheel per setup with its per-session bars beneath. Shell once, paint per
   render — a stable canvas is a reusable Chart.
   ─────────────────────────────────────────────────────────────────────────── */
const setupKey = setup => 'setup-' + setup.replace(/[^a-z0-9]/gi, '');

function setupShell() {
  const host = $('setup-table');
  if (!host || host.dataset.ready) return;
  host.innerHTML = `
    <div class="setup-donut-row">
      ${CONFIG.SETUPS.map(setup => {
        const key = setupKey(setup);
        return `
          <div class="setup-donut-col">
            <div class="setup-donut-label">${esc(setup)}</div>
            ${wheelBlock(key, '', 'period-stats')}
            <div class="setup-sess" id="sess-${key}"></div>
          </div>`;
      }).join('')}
    </div>`;
  host.dataset.ready = '1';
}

function renderSetups(rows) {
  setupShell();
  for (const setup of CONFIG.SETUPS) {
    const key  = setupKey(setup);
    const list = rows.filter(t => t.setup === setup);
    const c    = counts(list);
    const strip = $('strip-' + key);
    if (strip) strip.innerHTML = pctStrip(pctSplit([c.win, c.loss, c.be]));
    const sess = $('sess-' + key);
    if (sess) sess.innerHTML = sessionBars(list);
    paintWheel(key, c);   // last — see renderPeriods
  }
}

/* ─── Range roll-forward ─────────────────────────────────────────────────────
   This month against last: where the P&L started, what happened inside, where it
   ended. Last month's end IS this month's start, one row apart — if that pair
   disagrees, something upstream has gone wrong.
   ─────────────────────────────────────────────────────────────────────────── */
function rangeStats(rows, start, end) {
  let opening = 0;
  let best = null, worst = null;
  const inRange = [];

  for (const t of rows) {
    const d = dayOf(t);
    if (!d || t.pnl == null || d >= end) continue;
    if (d < start) { opening += t.pnl; continue; }
    inRange.push(t);
    if (best  === null || t.pnl > best)  best  = t.pnl;
    if (worst === null || t.pnl < worst) worst = t.pnl;
  }

  // money() is sign-based, which is what makes start + profit − loss equal end;
  // averages() runs on the result label, because a scratch is a dollar but not
  // a win.
  const m = money(inRange);
  const { avgWin, avgLoss } = averages(inRange);
  return {
    n: m.n, opening: round2(opening), gross: m.gross, loss: m.loss,
    closing: round2(opening + m.net), change: m.net,
    best, worst, avgWin, avgLoss,
    openBal: latestBefore(rows, 'balance', start), lastBal: latestBefore(rows, 'balance', end)
  };
}

function renderRollForward(rows) {
  const host = $('roll-forward');
  if (!host) return;

  const curStart  = Dates.monthStart();
  const prevStart = shiftMonth(curStart, -1);
  const nextStart = shiftMonth(curStart,  1);

  const cur  = rangeStats(rows, curStart,  nextStart);
  const prev = rangeStats(rows, prevStart, curStart);

  // Day 0 of the following month is the last day of this one, which sidesteps
  // leap years and 30/31.
  const rangeLabel = (start, end) => {
    const [sy, sm] = start.split('-').map(Number);
    const [ey, em] = end.split('-').map(Number);
    return `1–${new Date(ey, em - 1, 0).getDate()} ${CONFIG.MONTHS_ABBR[sm - 1]} ${String(sy).slice(2)}`;
  };

  const fig = v => v === null ? DASH : fmtMoney(v);

  // Heading the columns rather than taking a row: with two periods per line,
  // naming them once stops every row saying which is which.
  const head = `<div class="roll-row"><span></span>`
    + `<span class="roll-range">${rangeLabel(curStart, nextStart)}</span>`
    + `<span class="roll-range prior">${rangeLabel(prevStart, curStart)}</span></div>`;

  // These only track each other while no money moves in or out — a deposit
  // lifts both balances and leaves every P&L line untouched, which is why the
  // sum below is built from P&L alone.
  const context =
      rollRow('Balance at range start', [fig(cur.openBal), 0], [fig(prev.openBal), 0])
    + rollRow('Balance at range end',   [fig(cur.lastBal), 0], [fig(prev.lastBal), 0]);

  // Gross profit is always ≥ 0 and gross loss always ≤ 0, so colouring them is
  // decoration.
  const recon =
      rollRow('P&amp;L at range start', [fig(cur.opening), cur.opening], [fig(prev.opening), prev.opening])
    + rollRow('+ Gross profit',         [fig(cur.gross), cur.n ? 1 : 0], [fig(prev.gross), prev.n ? 1 : 0])
    + rollRow('&minus; Gross loss',     [fig(cur.loss), cur.n ? -1 : 0], [fig(prev.loss), prev.n ? -1 : 0])
    + rollRow('= P&amp;L at range end', [fig(cur.closing), cur.closing], [fig(prev.closing), prev.closing], 'roll-total');

  // ALL SIX MEMO ROWS, ALWAYS. An empty range dashes its values rather than
  // dropping the rows: these blocks are flex:1 with space-between, so
  // collapsing six rows to a message hands the height to the reconciliation
  // above and throws the panel out of alignment with the log. A dashed row also
  // still names the statistic. Net change stays a real 0.00 — no closed trades
  // IS a change of zero.
  const memo = `
    <div class="roll-memo">
      <div class="cbox-l roll-memo-title">In this range</div>
      ${rollRow('Net change',  [fig(cur.change), cur.change], [fig(prev.change), prev.change])}
      ${rollRow('Trades',      [String(cur.n), 0], [String(prev.n), 0])}
      ${rollRow('Best trade',  [fig(cur.best), cur.best], [fig(prev.best), prev.best])}
      ${rollRow('Worst trade', [fig(cur.worst), cur.worst], [fig(prev.worst), prev.worst])}
      ${rollRow('Avg win',     [fig(cur.avgWin), cur.avgWin === null ? 0 : 1],
                               [fig(prev.avgWin), prev.avgWin === null ? 0 : 1])}
      ${rollRow('Avg loss',    [fig(cur.avgLoss), cur.avgLoss === null ? 0 : -1],
                               [fig(prev.avgLoss), prev.avgLoss === null ? 0 : -1])}
    </div>`;

  host.innerHTML = `
    <div class="cbox-l">Range roll-forward</div>
    <div class="roll-body">
      <div class="roll-list">${head}${context}${recon}</div>
      ${memo}
    </div>`;
}

/* ─── What Eugenia is watching ───────────────────────────────────────────────
   The only place her work and this app meet, and deliberately narrow: what
   lands today, the story she is carrying, what is still open — three tables,
   three lists. Not her notes or turns, which stay denied to the publishable key;
   his audit of those is `/notes` in her thread.

   One read, after the render and never in front of it. A failure here leaves
   the card hidden and the journal untouched: nothing on it is why anyone
   opened the app.
   ─────────────────────────────────────────────────────────────────────────── */
const Watch = {
  // A rolling window, for the reason her briefing reads one: a civil-day filter
  // is at its worst exactly where this matters, since Sunday's 17:00 open is
  // about a week that has not started. Twelve hours back and a day forward needs
  // no boundary arithmetic to get wrong. Hers reaches four hours further ahead.
  // US releases only: what is filed from abroad is context for her, and a
  // night of it would push this morning's prints out of twenty rows.
  BACK_H: 12, AHEAD_H: 24,

  // A time from another day names the day, her own calendar's rule. Twelve
  // hours back and a day forward hold this morning's 08:30 and tomorrow's, which
  // otherwise read identically, and last night's 20:00 reads as tonight's.
  when(iso) {
    const time = Dates.nyTime(iso);
    if (Dates.nyDay(iso) === Dates.today()) return time;
    return new Intl.DateTimeFormat('en-GB', { timeZone: 'America/New_York', weekday: 'short' })
      .format(new Date(iso)) + ' ' + time;
  },

  async draw() {
    const host = $('watch-card');
    if (!host || !Data.sb) return;

    try {
      const from = new Date(Date.now() - this.BACK_H * 3600e3).toISOString();
      const to   = new Date(Date.now() + this.AHEAD_H * 3600e3).toISOString();

      const [cal, story, loops] = await Promise.all([
        Data.sb.from('eugenia_calendar')
          .select('at,name,importance,consensus,actual').eq('country', 'US')
          .gte('at', from).lte('at', to).order('at', { ascending: true }).limit(20),
        Data.sb.from('eugenia_thesis').select('thesis,moved_on').eq('id', 'current').maybeSingle(),
        Data.sb.from('eugenia_loops')
          .select('kind,body').is('closed_on', null).order('id', { ascending: false }).limit(8)
      ]);

      /* An error is not an empty list. supabase-js resolves rather than throws,
         so a missing table, a refusing policy and an expired session all come
         back as `{ data: null, error }` — read as `data || []`, three failures
         wearing the face of a quiet Sunday. */
      for (const [what, res] of [['calendar', cal], ['thesis', story], ['loops', loops]]) {
        if (res.error) throw Object.assign(new Error(`${what}: ${res.error.message}`), { cause: res.error });
      }

      const releases = cal.data || [];
      const threads  = loops.data || [];
      const thesis   = story.data?.thesis || '';

      // Nothing to say is said by not being there. An empty frame captioned
      // "no data" is worse than the absence it describes.
      if (!releases.length && !threads.length && !thesis) { host.style.display = 'none'; return; }

      const cols = [];

      if (releases.length) {
        // A landed release reads differently from a pending one, and rendering
        // them alike is how a card describes a print that already happened as
        // something still to come.
        const lines = releases.map(r => {
          const landed = !!r.actual;
          const what = landed
            ? `${esc(r.name)} &middot; ${esc(r.actual)}` +
              (r.consensus ? ` <span class="watch-moved">vs ${esc(r.consensus)}</span>` : '')
            : esc(r.name) + (r.consensus ? ` <span class="watch-moved">${esc(r.consensus)} exp</span>` : '');
          return `<div class="watch-line">`
               + `<span class="watch-when${landed ? ' watch-landed' : ''}">${esc(this.when(r.at))}</span>`
               + `<span class="watch-what">${what}</span></div>`;
        });
        cols.push(`<div class="watch-col"><div class="cbox-l">On the calendar</div>${lines.join('')}</div>`);
      }

      if (thesis) {
        const moved = story.data?.moved_on
          ? ` <span class="watch-moved">&middot; moved ${esc(story.data.moved_on)}</span>` : '';
        cols.push(`<div class="watch-col"><div class="cbox-l">The story she is carrying${moved}</div>`
                + `<div class="watch-story">${esc(thesis)}</div></div>`);
      }

      if (threads.length) {
        const lines = threads.map(l =>
          `<div class="watch-line"><span class="watch-when">${l.kind === 'question' ? 'asked' : 'watch'}</span>`
          + `<span class="watch-what">${esc(l.body)}</span></div>`);
        cols.push(`<div class="watch-col"><div class="cbox-l">Still open</div>${lines.join('')}</div>`);
      }

      host.innerHTML = `<div class="watch-grid">${cols.join('')}</div>`;
      host.style.display = 'flex';
    } catch (e) {
      // Warned rather than surfaced: a card that cannot draw is not a reason to
      // tell him anything, and her tables not yet applied is the likely cause.
      console.warn('Doji: Eugenia card unavailable', e);
      host.style.display = 'none';
    }
  }
};

/* ─── Trade log ──────────────────────────────────────────────────────────── */
function renderTable(rows) {
  const host = $('trade-table'), pag = $('tlog-pagination');
  if (!rows.length) {
    host.innerHTML = '<div class="empty-msg">No trades yet. Trades appear here automatically when your broker fills them.</div>';
    pag.innerHTML = '';
    return;
  }

  const sorted = [...rows].sort((a, b) => byKey(b, a));   // newest first
  const pages  = Math.ceil(sorted.length / CONFIG.PER_PAGE);
  // This draw only: deleting the last trade on the last page leaves the stored
  // page past the end, and no renderer writes state.
  const page0 = Math.min(View.page, pages - 1);
  const slice = sorted.slice(page0 * CONFIG.PER_PAGE, (page0 + 1) * CONFIG.PER_PAGE);

  const tick = v => v === true ? '<span class="rules-tick">✓</span>'
                  : v === false ? '<span class="rules-cross">✕</span>' : DASH;

  const body = slice.map(t => {
    const r      = resultOf(t);
    const pnlTxt = t.pnl == null ? DASH : fmtSigned(t.pnl);
    const clock  = t.entry_time ? Dates.nyTime(t.entry_time) : '';
    const sess   = sessionOf(t);
    // The row opens the entry, so it says so and answers the keyboard.
    return `<tr data-trade="${esc(t.id)}" role="button" tabindex="0"${isComplete(t) ? '' : ' class="broker-pending"'}>
      <td>${Dates.fmt(dayOf(t))}${clock ? `<span class="tlog-time">${clock} ET</span>` : ''}</td>
      <td><span class="dir-pill">${esc(t.direction || DASH)}</span></td>
      <td>${esc(sess ? CONFIG.SESSION_ABBR[sess] : DASH)}</td>
      <td>${setupCell(t.setup)}</td>
      <td class="${r === 'win' ? 'win' : r === 'loss' ? 'loss' : ''}">${pnlTxt}</td>
      <td class="c">${tick(t.followed_rules)}</td>
      <td class="c">${tick(t.followed_sl)}</td>
      <td class="c">${tick(t.followed_tp)}</td>
      <td><button class="del-btn" data-del="${esc(t.id)}" title="Delete trade" aria-label="Delete trade">✕</button></td>
    </tr>`;
  }).join('');

  host.innerHTML = `<table><thead><tr>
      <th>Date</th><th>Dir</th><th>Session</th><th>Setup</th>
      <th>P&amp;L</th><th class="c">Rules</th><th class="c">SL</th><th class="c">TP</th><th></th>
    </tr></thead><tbody>${body}</tbody></table>`;

  if (pages > 1) {
    const from = page0 * CONFIG.PER_PAGE + 1;
    const to   = Math.min((page0 + 1) * CONFIG.PER_PAGE, sorted.length);
    pag.innerHTML = `
      <span class="tlog-pag-info">${from}–${to} of ${sorted.length}</span>
      <button class="tlog-pag-btn" data-page="prev" ${page0 === 0 ? 'disabled' : ''}>← Prev</button>
      <button class="tlog-pag-btn" data-page="next" ${page0 === pages - 1 ? 'disabled' : ''}>Next →</button>`;
  } else {
    pag.innerHTML = '';
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   JOURNAL — the entry modal

   Every entry belongs to a trade that already exists. The broker mints it; the
   journal only fills it in. There is no path that creates one from nothing — a
   trade with no position could never be matched by the sync and would sit in the
   log forever as a duplicate.
   ═══════════════════════════════════════════════════════════════════════════ */
const Journal = {
  id: null,

  // Broker columns are absent: the poller rewrites them every two minutes, so a
  // control over them could only lie, and the trade log already reads them.
  open(id) {
    const t = Data.byId.get(id);
    if (!t) return;
    Journal.id = id;
    $('jm-body').innerHTML = journalForm(t);
    openModal('journal-modal');
  },

  close() {
    closeModal('journal-modal');
    Journal.id = null;
  },

  async save() {
    if (!Data.byId.has(Journal.id)) { notify('Trade not found.', true); return; }

    const ok = await Data.save(Journal.id, {
      setup:          pickRadio('jf-setup') || null,
      followed_rules: pickYN('followed_rules'),
      followed_sl:    pickYN('followed_sl'),
      followed_tp:    pickYN('followed_tp')
    });
    if (!ok) return;

    Journal.close();
    render();
    notify('Entry saved');
  }
};

// No selection means unanswered — null, not false. The three-state answer is
// why these are booleans.
function pickYN(name) {
  const v = pickRadio(name);
  return v === 'yes' ? true : v === 'no' ? false : null;
}
const pickRadio = name => $('jm-body')?.querySelector(`input[name="${name}"]:checked`)?.value || '';

function journalForm(t) {
  const setups = CONFIG.SETUPS.map(s => {
    const id = 'jf-' + setupKey(s);
    return `
      <input type="radio" class="jf-pill-radio" name="jf-setup" id="${id}" value="${esc(s)}"${t.setup === s ? ' checked' : ''}>
      <label class="jf-pill-lbl" for="${id}">${esc(s)}</label>`;
  }).join('');

  const yn = [
    ['followed_rules', 'Followed rules?',       t.followed_rules],
    ['followed_sl',    'Followed stop loss?',   t.followed_sl],
    ['followed_tp',    'Followed take profit?', t.followed_tp]
  ].map(([name, label, val]) => {
    const opts = [['yes', true, 'Yes'], ['no', false, 'No']].map(([v, bool, text]) => `
      <input type="radio" class="jf-pill-radio" name="${name}" id="${name}-${v}" value="${v}"${val === bool ? ' checked' : ''}>
      <label class="jf-pill-lbl jf-yn-pill" for="${name}-${v}">${text}</label>`).join('');
    return `<div class="jf-yn-item">
      <label class="journal-q-label">${label}</label>
      <div class="jf-yn-buttons">${opts}</div>
    </div>`;
  }).join('');

  // Save and Cancel only. A destructive action should not share a row with the
  // way out of a dialog, where it would sit one button from Cancel and similar
  // enough to hit by accident. Deleting is the ✕ in the log, deliberate to
  // reach and still carrying the undo window.
  return `
    <div class="journal-form">
      <div class="jm-card">
        <div class="jf-setup-row">${setups}</div>
        <div class="jf-yn-row">${yn}</div>
      </div>
      <div class="journal-form-actions">
        <button class="jm-btn-save"   data-jm-action="save">Save</button>
        <button class="jm-btn-cancel" data-jm-action="cancel">Cancel</button>
      </div>
    </div>`;
}

/* ─── Day picker ─────────────────────────────────────────────────────────────
   A calendar day holding one trade opens it directly; two or more open a small
   picker so the trader chooses which.
   ─────────────────────────────────────────────────────────────────────────── */
function openDay(day) {
  const list = Data.day(day).list;
  if (!list.length) return;
  if (list.length === 1) { Journal.open(list[0].id); return; }

  const host = $('day-trade-list');
  if (!host) return;

  const m = money(list);
  const res = aggregateResult(m.net, m.n, counts(list).be);
  const dateStr = Dates.fmt(day, { weekday:'short', day:'2-digit', month:'short', year:'numeric' });
  $('day-modal-title').innerHTML = `${dateStr} &nbsp;·&nbsp; ${list.length} trades`
    + (m.n ? ` &nbsp;·&nbsp; <span class="${res === 'be' ? '' : res}">${fmtSigned(m.net)}</span>` : '');

  host.innerHTML = [...list].sort((a, b) => byKey(b, a)).map(t => {
    const r = resultOf(t);
    const pnl = t.pnl == null ? DASH : fmtSigned(t.pnl);
    const sess = sessionOf(t);
    const dir = t.direction === 'BUY' ? 'Long' : t.direction === 'SELL' ? 'Short' : DASH;
    return `<div class="day-trade-row" data-trade="${esc(t.id)}" role="button" tabindex="0">
      <div class="day-trade-left">
        <span class="dir-pill">${dir}</span>
        <div class="day-trade-meta">
          <span class="day-trade-setup">${setupCell(t.setup)}</span>
          <span class="day-trade-sub">${esc(sess ? CONFIG.SESSION_ABBR[sess] : DASH)}</span>
        </div>
      </div>
      <span class="day-trade-pnl ${r === 'win' ? 'win' : r === 'loss' ? 'loss' : ''}">${pnl}</span>
    </div>`;
  }).join('');

  openModal('day-modal');
}

/* Every modal opens and closes through this pair, so one added later cannot
   quietly miss the class, the aria-hidden or the focus move. Focus enters the
   dialog on open and returns to whatever opened it on close, which is also what
   makes Escape land somewhere sensible rather than on the document. */
let lastFocus = null;

function openModal(id) {
  const m = $(id);
  if (!m) return;
  lastFocus = document.activeElement;
  m.classList.add('open');
  m.setAttribute('aria-hidden', 'false');
  // First focusable inside the dialog, falling back to the dialog itself.
  const first = m.querySelector('button, input, [tabindex]:not([tabindex="-1"])');
  (first || m).focus?.({ preventScroll: true });
}

function closeModal(id) {
  const m = $(id);
  if (!m) return;
  m.classList.remove('open');
  m.setAttribute('aria-hidden', 'true');
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus?.({ preventScroll: true });
  lastFocus = null;
  Data.flushDeferred();
}

/* ─── Delete ─────────────────────────────────────────────────────────────────
   The delete applies immediately and the row is held for the undo window. A
   confirm dialog gets clicked through on reflex; an undo window forgives it.
   Only the most recent is recoverable — staging a new one finalises the previous,
   and closing the tab inside the window makes it permanent, so nothing ends up
   in limbo.
   ─────────────────────────────────────────────────────────────────────────── */
const PendingDelete = {
  timer: 0,
  id: null,

  async stage(id) {
    PendingDelete.commit();
    if (!Data.byId.has(id)) return;
    PendingDelete.id = id;
    if (!await Data.remove(id)) { PendingDelete.id = null; return; }
    render();
    notifyUndo('Trade deleted');
    PendingDelete.timer = setTimeout(PendingDelete.commit, CONFIG.UNDO_MS);
  },

  async undo() {
    clearTimeout(PendingDelete.timer);
    const id = PendingDelete.id;
    PendingDelete.id = null;
    if (!id) return;
    // The id is cleared above whatever happens, so a second Undo is inert. The
    // message states where the trade ended up rather than inviting a retry that
    // cannot work.
    if (await Data.restore(id)) { render(); notify('Trade restored'); }
    else notify('Restore failed — the trade is still deleted.', true);
  },

  commit() {
    clearTimeout(PendingDelete.timer);
    PendingDelete.id = null;
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   LOGIN — the session gate
   ═══════════════════════════════════════════════════════════════════════════ */
const Login = {
  show() {
    const o = $('login-overlay');
    o.classList.add('open');
    o.setAttribute('aria-hidden', 'false');
    $('login-email')?.focus();
  },
  hide() {
    const o = $('login-overlay');
    o.classList.remove('open');
    o.setAttribute('aria-hidden', 'true');
    $('login-err').textContent = '';
  },
  async submit() {
    const btn = $('login-btn'), err = $('login-err');
    const email = $('login-email').value.trim();
    const pass  = $('login-pass').value;
    if (!email || !pass) { err.textContent = 'Enter your email and password.'; return; }
    btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
    try {
      const { error } = await Data.sb.auth.signInWithPassword({ email, password: pass });
      if (error) { err.textContent = 'Wrong email or password.'; return; }
      Login.hide();
      bootState('Loading your journal…');
      await Data.start();
      render();
      bootState(null);
      // Boot's own order: the card after the journal, never in front of it.
      Watch.draw();
    } catch (e) {
      console.error('Doji login:', e);
      err.textContent = 'Could not reach the server. Try again.';
    } finally {
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  },
  async signOut() {
    await Data.sb.auth.signOut();
    // A full copy of the trade history in plaintext. Left behind, the next
    // person sees the login screen and the previous session's data one keypress
    // apart.
    try { localStorage.removeItem(CONFIG.SNAPSHOT); } catch (e) {}
    location.reload();
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   MOBILE
   ═══════════════════════════════════════════════════════════════════════════ */
const Phone = window.matchMedia('(max-width:640px)');

// Scroll and snap are pure CSS. This adds only what CSS cannot: position dots,
// and which slide was on top so a re-render restores it.
const Carousel = {
  pos: Object.create(null),

  refresh() {
    const rows = [
      ['period', $('period-row')],
      ['setup',  document.querySelector('#setup-table .setup-donut-row')]
    ];
    for (const [key, el] of rows) {
      if (!el || el.dataset.carousel) continue;
      el.dataset.carousel = key;
      Carousel.dots(key, el);
      el.addEventListener('scroll', () => {
        const idx = Math.round(el.scrollLeft / (el.clientWidth || 1));
        if (idx !== Carousel.pos[key]) { Carousel.pos[key] = idx; Carousel.paint(key, el); }
      }, { passive: true });
      // Layout must be final — fonts and canvas sizing — before scrollLeft
      // lands on a real width.
      const saved = Carousel.pos[key];
      if (saved) requestAnimationFrame(() => requestAnimationFrame(() => {
        el.scrollLeft = saved * el.clientWidth;
      }));
    }
  },

  dots(key, el) {
    let dots = el.nextElementSibling;
    if (!dots?.classList?.contains('snap-dots')) {
      dots = document.createElement('div');
      dots.className = 'snap-dots';
      el.insertAdjacentElement('afterend', dots);
    }
    dots.innerHTML = Array.from({ length: el.children.length }, (_, i) =>
      `<button class="snap-dot" data-slide="${i}" aria-label="Slide ${i + 1}"></button>`).join('');
    dots.addEventListener('click', e => {
      const b = e.target.closest('[data-slide]');
      if (b) el.scrollTo({ left: (+b.dataset.slide) * el.clientWidth, behavior: 'smooth' });
    });
    Carousel.paint(key, el);
  },

  paint(key, el) {
    const dots = el.nextElementSibling;
    if (!dots?.classList.contains('snap-dots')) return;
    const cur = Carousel.pos[key] || 0;
    [...dots.children].forEach((d, i) => d.classList.toggle('on', i === cur));
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   WATCHER

   It tracks a key that only changes on a real boundary, so a throttled timer or
   a sleeping machine can delay it but never make it miss or double-fire.
   ═══════════════════════════════════════════════════════════════════════════ */
const DayWatcher = {
  day: null,
  check() {
    const today = Dates.today();
    if (today === DayWatcher.day) return;
    const prevMonth = DayWatcher.day?.slice(0, 7);
    DayWatcher.day = today;
    // Only at a real boundary — someone paging back mid-month is never yanked
    // forward.
    if (prevMonth && today.slice(0, 7) !== prevMonth) View.heatmap = Dates.nyMonth();
    render();
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   WIRING — split by surface, so adding a control means editing one function.
   All of it runs once, at boot.
   ═══════════════════════════════════════════════════════════════════════════ */
function wire() {
  // Chrome
  // Both halves guarded: `(a || b).call(x)` throws where neither exists, giving
  // a TypeError on a chrome button rather than a no-op.
  const root = document.documentElement;
  const enter = root.requestFullscreen || root.webkitRequestFullscreen;
  const exit  = document.exitFullscreen || document.webkitExitFullscreen;
  const fsOn = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  const fsSync = () => $('nav-fs-btn')?.classList.toggle('is-fs', fsOn());
  if (!enter || !exit) $('nav-fs-btn')?.remove();   // no API: no button, no handler
  else on('nav-fs-btn', 'click', () => { fsOn() ? exit.call(document) : enter.call(root); });
  document.addEventListener('fullscreenchange', fsSync);
  document.addEventListener('webkitfullscreenchange', fsSync);
  // The Saturday column at the breakpoint is structure, not styling, so only
  // the renderer can do it.
  Phone.addEventListener('change', renderHeatmap);
  // On the sync dot: the one piece of chrome already about the account rather
  // than the trades.
