<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Doji — XAUUSD Trading Journal">
<meta name="theme-color" content="#04100b">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2304100b' rx='6'/><text x='16' y='23' font-family='SF Pro Display,Helvetica Neue,Arial,sans-serif' font-size='22' font-weight='700' fill='%230c8650' text-anchor='middle'>D</text></svg>">
<!-- Home screen icon. iOS reads it once, when the shortcut is created, so
     changing it means deleting the shortcut and adding it back. The SVG favicon
     above stays: browser tab, different surface. -->
<link rel="apple-touch-icon" href="/icon-512.png">
<title>Doji</title>
<!-- DNS and TLS overlap the HTML parse. Supabase is the one that matters: its
     connection does not survive a page load, so the handshake is paid on every
     open. `crossorigin` is load-bearing — without it a preconnect opens a
     second connection that then goes unused. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://gujhyogvkzjgnrodyuse.supabase.co" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   DESIGN TOKENS
   ═══════════════════════════════════════════════════════════════════════════ */
:root {
  /* Emerald accent. Deep enough that --tx-max on solid --p clears 4.5:1, and
     yellower than --win so the two do not read as one colour. */
  --p:#0c8650;
  --p-gl:rgba(12,134,80,.07); --p-gl2:rgba(12,134,80,.16); --p-gl3:rgba(12,134,80,.30);
  --p-hair:rgba(12,134,80,.04);  /* table row rule */

  /* Unfinished. Its own hue, not the accent's: an emerald pending day would read
     as a won one. Violet sits opposite emerald and clear of all three results. */
  --pend:#8b35b8;
  --pend-gl:rgba(139,53,184,.07); --pend-gl2:rgba(139,53,184,.16);
  --pend-gl3:rgba(139,53,184,.30); --pend-gl4:rgba(139,53,184,.42);

  /* Layered backgrounds — near-black with a faint emerald hue */
  --bg:#04100b; --s2:#0c1f15;

  /* Borders — dim emerald lines */
  --bd:#1e3829; --bd2:#2a4a37;

  /* Text */
  --tx:#e6f0ea; --mt:#678873; --mt2:#92b09d;

  /* Win / Loss */
  --win:#3ba585; --loss:#d63d5a;

  /* Card surfaces */
  --glass:#07130d;             /* solid dark card surface — flat, no translucency */
  --glass-bd:#1e3829;

  /* Type */
  --ui:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;

  /* Radius scale */
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-full:999px;
  /* Calendar cells only. At the card radius each tile looks like its own card
     and the rows stop scanning as rows — an exception to the rounding, not a
     change. */
  --r-cell:5px;

  /* Shared bar thickness — session, discipline and R:R. */
  --bar-h:10px;
  /* Shared segment border thickness, so the "margin" weight is identical across
     donut arcs, bars and calendar cells. */
  --seg-bd:1.5px;
  /* The hollow placeholder ring for a wheel with nothing to plot. Here rather
     than in mountDonut so every wheel colour is in one place. */
  --seg-empty-bg:rgba(255,255,255,.04); --seg-empty-bd:rgba(255,255,255,.06);
  /* Every win / loss / break-even surface: bar segments, donut arcs, calendar
     cells. Flat 12% fill against a full-strength border is the house treatment.
     mountDonut() reads these same vars, so the Chart.js arcs cannot drift from
     the CSS. */
  --seg-win-bg:rgba(59,165,133,.12);
  --seg-loss-bg:rgba(214,61,90,.12);
  /* Break-even — dark and cool, below the surface ladder rather than on it.
     Green runs at or above red so a small tile goes cool rather than mauve: the
     rest of the palette has red above green, which reads warm on a large card
     and muddy on a 58px cell. The fill/border brightness gap is wide on
     purpose, or the tile loses its edge and hazes.

     Deliberately the darkest of the three results: nothing happened, so it
     recedes furthest. The red channel is the earthiness lever — lower the first
     pair of digits to go cooler. */
  --seg-be-bg:#0e1020;
  --seg-be-bd:#333f63;
  /* The result palette one step brighter. Tokenised so a nudge to one cannot
     silently leave the others behind. */
  --seg-win-hv:rgba(59,165,133,.22);
  --seg-loss-hv:rgba(214,61,90,.22);
  --seg-be-hv:#151a30;
  /* Not --mt2: break-even is a result, so its colour belongs with the other two
     results rather than with muted text. */
  /* --mt2's role — a figure with no verdict — shifted cool to match the fill it
     sits on, where green-grey would clash warm against cold. */
  --be-tx:#9aa4c0;
  /* Every neutral surface, hover and hairline comes from one of these five, so
     an alpha is changed in one place. */
  --fill-0:rgba(255,255,255,.02);   /* inset panels (day cell, day row)        */
  --fill-1:rgba(255,255,255,.04);   /* pills, inputs                           */
  --fill-2:rgba(255,255,255,.07);   /* hover on a --fill-1 surface             */
  --fill-3:rgba(255,255,255,.08);   /* hover on a --fill-2 surface             */
  --row-hv:rgba(255,255,255,.03);   /* table row hover                         */
  --hair-2:rgba(255,255,255,.07);   /* equity-curve grid lines                 */
  --bd-hi:rgba(255,255,255,.30);    /* pill border on hover                    */
  /* The only two tones lighter than --tx. --tx-hi sits on an accent fill, --tx-
     max only on solid --p. */
  --tx-hi:#eefaf3; --tx-max:#fff;
  --pill-tx:rgba(255,255,255,.75);
  /* "Notice this", one step short of --loss. Sole user is the sync dot's
     offline state — a cached copy is a state, not a failure. */
  --warn:#d9a441;
  /* A shade below --glass, so a resultless day recedes behind those with one. */
  --cell-bg:rgba(8,8,10,.55);
  /* Held as the whole gradient rather than just its colour: all four users want
     identical geometry. */
  --aura:radial-gradient(760px 520px at 6% -8%, rgba(18,120,96,.12), transparent 62%);
  /* Gap between adjacent chart segments, and between calendar cells. */
  --seg-gap:3px;
  /* BETWEEN two segments inside one track — --seg-gap separates whole tiles. */
  --seg-hair:1px;

  /* Every section gap, title gap, divider and bar-row gap, so vertical rhythm
     stays even across the panel. */
  --gap-section:16px;  /* space between major sections / cards */
  --gap-title:12px;    /* space below a section title, before its content */
  --gap-divider:14px;  /* padding below an internal divider line */
  --gap-row:12px;      /* rhythm between stacked bar rows */

  /* Near-opaque: the journal's own panels are opaque, so anything bleeding
     through shows in the gaps BETWEEN cards and reads as the surfaces mixing. */
  --scrim:rgba(2,8,5,.95);

  /* Elevation */
  --sh-2:0 4px 18px -8px rgba(0,0,0,.55), 0 1px 0 rgba(255,255,255,.04) inset;
  --sh-3:0 16px 48px -14px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.06) inset;
}

/* ═══════════════════════════════════════════════════════════════════════════
   RESET & BASE
   ═══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
/* Declares the document dark so browser chrome matches — scrollbars, and the
   login inputs, which iOS otherwise draws light. */
html { color-scheme:dark; }
html,body { height:100%; overflow:hidden; }
body {
  background:var(--bg); color:var(--tx);
  font-family:var(--ui);
  font-size:13px; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  position:relative;
}
/* Atmospheric depth — single faint cool-emerald glow, top-left corner */
body::before {
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    var(--aura);
}
nav, .panels { position:relative; z-index:1; }
button, input, textarea { font-family:inherit; }
/* :focus-visible, not :focus — matched only for keyboard/AT navigation, so a
   mouse user never sees a ring. */
:focus-visible { outline:2px solid var(--p); outline-offset:2px; border-radius:2px; }
/* Rows and cells that act as buttons opt into the same ring. */
tbody tr:focus-visible, .day-trade-row:focus-visible, .heatmap-cell:focus-visible,
.hm-mo:focus-visible { outline:2px solid var(--p); outline-offset:-2px; }

/* ═══════════════════════════════════════════════════════════════════════════
   TYPOGRAPHY — the shared type primitives
   ───────────────────────────────────────────────────────────────────────────
   Every figure and every label is mono, and every uppercase label sits at one of
   three sizes. Component rules below declare only what makes them DIFFERENT
   (weight, colour, alignment); a rule that states its own size or tracking is a
   deliberate exception rather than a copy.
   ═══════════════════════════════════════════════════════════════════════════ */
.nav-icon-btn, .btn, .cbox-l, .period-label, .period-disc-lbl, .setup-donut-label,
.sess-wr-label, .period-pnl,
.period-counts-left span, .period-counts-right span, .pm-lbl, .pm-val,
.period-disc-pct, .pnl-balance-number, .pnl-balance-at, .pnl-net-number,
.pnl-net-count, .pnl-stat-lbl, .pnl-stat-val, .ps-tag, .ps-fig,
.heatmap-title, .hm-mo-count, .hm-mo-pnl, .hm-mo-lbl, .heatmap-dow,
.heatmap-week-count, .heatmap-week-pnl, .heatmap-week-lbl, .heatmap-cell-day,
.heatmap-cell-count, .heatmap-cell-pnl, .tlog-time, .tlog-pag-info,
.tlog-pag-btn, .roll-range, thead th, td, .dir-pill, .sess-wr-pct,
.journal-q-label, .jf-pill-lbl,
.jm-btn-save, .jm-btn-cancel, .day-modal-title, .day-trade-sub, .day-trade-pnl,
.notif, .notif-undo, .login-sub, .login-input, .login-err, .broker-banner b,
.broker-banner-cta, .boot-msg {
  font-family:var(--mono);
}

/* Tier 1 — where a label opens a block rather than annotating a figure. */
.btn, .cbox-l, .journal-q-label, .jm-btn-save, .jm-btn-cancel, .login-sub {
  font-size:9px; letter-spacing:1.5px; text-transform:uppercase;
}

/* Tier 2 — in-block labels. A name sitting beside or above its own figure. */
thead th, .notif-undo, .broker-banner-cta, .period-label, .period-disc-lbl,
.setup-donut-label, .sess-wr-label, .roll-range {
  font-size:9px; letter-spacing:1px; text-transform:uppercase;
}

/* Tier 3 — captions under or inside a figure. The quietest tier. */
.pnl-stat-lbl, .heatmap-dow, .day-trade-sub {
  font-size:8px; letter-spacing:1px; text-transform:uppercase;
}

/* ═══════════════════════════════════════════════════════════════════════════
   NAV
   ═══════════════════════════════════════════════════════════════════════════ */
nav {
  flex-shrink:0; display:flex; align-items:center; padding:0 24px; height:52px;
  background:transparent;
  z-index:50; position:relative;
}
.logo {
  font-weight:800; font-size:16px; letter-spacing:3px; flex-shrink:0;
  color:var(--p);
}
.nav-actions { display:flex; align-items:center; gap:8px; margin-left:auto; }
.nav-icon-btn {
  padding:6px 10px; border:1px solid var(--bd); border-radius:var(--r-sm);
  background:transparent; color:var(--mt2); cursor:pointer; line-height:1;
  font-size:14px;
}
.nav-icon-btn:hover { border-color:var(--p); color:var(--p); background:var(--p-gl); }
#nav-fs-btn { display:inline-flex; align-items:center; justify-content:center; }
#nav-fs-btn .fs-ico-exit { display:none; }
#nav-fs-btn.is-fs .fs-ico-enter { display:none; }
#nav-fs-btn.is-fs .fs-ico-exit { display:inline; }

/* ═══════════════════════════════════════════════════════════════════════════
   PANELS
   ═══════════════════════════════════════════════════════════════════════════ */
.panels { flex:1; position:relative; overflow:hidden; }
/* Absolutely positioned inside .panels so the PANEL is the scroll container,
   not the page: the nav stays put and only the content under it moves. */
.panel { position:absolute; inset:0; overflow-y:auto; padding:26px 30px; }
.panel::-webkit-scrollbar { width:6px; }
.panel::-webkit-scrollbar-thumb { background:var(--p); border-radius:var(--r-full); }
.panel::-webkit-scrollbar-track { background:transparent; }


/* ═══════════════════════════════════════════════════════════════════════════
   BUTTONS
   ═══════════════════════════════════════════════════════════════════════════ */
.btn {
  padding:8px 15px; border:1px solid var(--bd2); background:transparent; color:var(--mt2);
  cursor:pointer; border-radius:var(--r-sm);
}
.btn:hover { border-color:var(--p); color:var(--p); }
.btn.primary { background:var(--p); color:var(--tx-max); border-color:var(--p); font-weight:600; }
.btn.primary:hover { background:var(--p); color:var(--tx-max); box-shadow:0 0 22px -4px var(--p-gl3); }

.icon-btn {
  background:none; border:none; color:var(--mt2); cursor:pointer;
  font-size:16px; line-height:1;
}
.icon-btn:hover { color:var(--tx); }

/* ═══════════════════════════════════════════════════════════════════════════
   GRIDS & CARDS
   ═══════════════════════════════════════════════════════════════════════════ */
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:var(--gap-section); }
.cbox {
  background:var(--glass); border:1px solid var(--glass-bd);
  padding:16px 18px;
  border-radius:var(--r-md); box-shadow:var(--sh-2);
}
/* Opt-in rather than part of .cbox: a card inside a grid takes its spacing from
   the grid gap, not the section rhythm. */
.cbox.section { margin-bottom:var(--gap-section); }

/* ─── What Eugenia is watching ──────────────────────────────────────────────
   The only place her work and this app meet. Three columns that collapse to one
   on a phone, because the three are independent lists rather than a table — a
   grid keeps them level without any of them stretching over dead space.

   No new colour: the whole card is drawn in the tokens already here. A landed
   release takes --win the way a positive figure does elsewhere, because it is
   the same idea — the thing has settled — and inventing a fourth accent for it
   would be a palette entry nobody could name. */
.watch-card { display:flex; flex-direction:column; gap:14px; }
.watch-grid {
  display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
  gap:14px 22px;
}
.watch-col { display:flex; flex-direction:column; gap:7px; min-width:0; }
.watch-line { display:flex; gap:8px; font-size:12.5px; line-height:1.45; color:var(--mt2); }
.watch-when {
  font-family:var(--mono); font-size:11.5px; color:var(--mt);
  flex:0 0 auto; padding-top:1px;
}
.watch-what { min-width:0; overflow-wrap:anywhere; }
.watch-landed { color:var(--win); }
.watch-story { font-size:12.5px; line-height:1.5; color:var(--mt2); overflow-wrap:anywhere; }
.watch-moved { color:var(--mt); }
/* Divided column grids. 4px here plus each column's 14px lands content on the
   same 18px edge as plain cards, so both share one left margin. */
.cbox.cols { padding:16px 4px; }
.cbox-l {
  color:var(--mt2); margin-bottom:var(--gap-title);
}
/* Sole user is the cumulative-P&L canvas: its row height comes from the taller
   of the .grid-2 pair, so the plot takes all of it. The floor keeps it readable
   if it ends up the taller card. */
.chart-card { display:flex; flex-direction:column; }
.chart-area { position:relative; width:100%; flex:1; min-height:96px; }
.chart-area canvas { position:absolute !important; top:0; left:0; width:100% !important; height:100% !important; }

/* ═══════════════════════════════════════════════════════════════════════════
   PERIOD DONUTS (All Time / Week / Month)
   ═══════════════════════════════════════════════════════════════════════════ */
.period-card {
  background:var(--glass); border:1px solid var(--glass-bd);
  margin-bottom:var(--gap-section); border-radius:var(--r-md); overflow:hidden;
  box-shadow:var(--sh-2);
}
.period-row {
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:0;
  /* Vertical padding insets the dividers. Horizontal is 4px because each column
     adds 14px, landing on the shared 18px edge. */
  padding:16px 4px;
}
.period-col {
  background:transparent; padding:0 14px;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  border-left:1px solid var(--glass-bd);
}
.period-col:first-child { border-left:none; }
/* ── Unified metric-label typography ─────────────────────────────────────────
   Every in-section metric label — period, setup, session. Section headers
   (.cbox-l) are a separate, dimmer tier and intentionally excluded. */
.period-label, .period-disc-lbl, .setup-donut-label, .sess-wr-label {
  font-weight:400;
  color:var(--mt);
}
.period-label { align-self:flex-start; }
/* The wheel takes one line, its figure strip the next: the strip is flex:1 0
   100%, so it only claims a line if the host wraps. .period-col centres its
   children, so without width:100% the row shrink-wraps and takes the strip with
   it. */
.period-host {
  position:relative; display:flex; align-items:center; justify-content:center;
  flex-wrap:wrap; width:100%; gap:14px;
}
.period-donut-wrap { position:relative; width:108px; height:108px; flex-shrink:0; }
/* Tooltips and clicks are disabled, so the cursor stays an arrow — the wheels
   are read- only. */
.period-donut-wrap canvas { cursor:default; }
.period-center {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; pointer-events:none;
}
.period-pnl { font-size:9px; font-weight:600; line-height:1; color:var(--mt2); }
.period-counts-left,
.period-counts-right {
  display:flex; flex-direction:column; gap:4px; flex-shrink:0;
}
.period-counts-left  { align-items:flex-end; }
.period-counts-right { align-items:flex-start; }
.period-counts-left span,
.period-counts-right span {
  font-size:9px; font-weight:600;
  line-height:1.1; letter-spacing:.5px; white-space:nowrap;
}
/* Colour follows the class, never the side, so counts can be re-sided without a
   CSS edit. Sides are set in markup to mirror the arcs: mountDonut plots [win,
   loss, be] clockwise from twelve, so win sweeps RIGHT and loss/BE land LEFT, B
   above L. Each figure sits beside the colour it counts. */
.pc-w { color:var(--win); }
.pc-l { color:var(--loss); }
.pc-b { color:var(--mt2); }

/* ── Per-wheel money strip ─────────────────────────────────────────────────
   Four figures in equal columns on their own line, label over value. A narrow
   column and a wide one differ only in how much air the columns get, never in
   arrangement — one layout, no breakpoint. */
.period-money {
  display:grid; flex:1 0 100%;
  grid-template-columns:repeat(4,1fr); grid-template-rows:auto auto;
  grid-auto-flow:column; justify-items:center; align-items:baseline;
  row-gap:3px; column-gap:8px;
}
.pm-lbl {
  font-size:7px; letter-spacing:1px;
  text-transform:uppercase; color:var(--mt);
}
.pm-val {
  font-size:10px; font-weight:600;
  line-height:1.1; letter-spacing:.5px; white-space:nowrap; color:var(--mt2);
}
.pm-val.win  { color:var(--win); }
.pm-val.loss { color:var(--loss); }

/* ── Percentage figure strip (setup wheels) ────────────────────────────────
   Same grid and primitives as .period-money, applied alongside it to inherit
   rather than restate. Drops the inherited track list so grid-auto-flow:column
   mints one column per figure — adding a figure needs no CSS change. */
.period-stats { grid-template-columns:none; grid-auto-columns:1fr; }

/* Above each wheel. No rule of its own — .period-disc's is the only divider in
   the column — but it keeps the 8px so the wheel sits the same distance from the
   bar above it as from the rule below. */
.period-rr { width:100%; margin-bottom:8px; }

/* Beneath each wheel, reusing the session-bar segments for one green-followed /
   red- missed read. */
.period-disc {
  width:100%; display:flex; flex-direction:column; gap:var(--gap-row);
  margin-top:8px; padding-top:var(--gap-divider); border-top:1px solid var(--glass-bd);
}
.period-disc-row  { display:flex; flex-direction:column; gap:5px; }
.period-disc-head { display:flex; justify-content:space-between; align-items:baseline; }
.period-disc-pct { font-size:10px; font-weight:500; }
.period-disc-pct.win  { color:var(--win); }
.period-disc-pct.loss { color:var(--loss); }
.period-disc-pct.dim  { color:var(--mt2); }

/* ═══════════════════════════════════════════════════════════════════════════
   P&L CARD — net figure + performance stats
   ───────────────────────────────────────────────────────────────────────────
   Both halves take an equal share so the divider lands on the midpoint, and the
   28px inside .pnl-net is mirrored by the 28px flex gap outside it. Vertical
   padding matches plain .cbox so this card's titles sit on the same line as
   Cumulative P&L beside it; the horizontal 26px is the divider's geometry.
   ═══════════════════════════════════════════════════════════════════════════ */
/* Standard .cbox padding: the divider's geometry lives in .pnl-net and the flex
   gap, independent of it. */
.pnl-card { padding:16px 18px; }
.pnl-card-inner { display:flex; align-items:stretch; gap:28px; }
/* The balance the last synced fill reported, then the journal's own net. */
/* Top, not centred: centring floats each title to wherever its own column
   balances, landing the two at different heights and neither on Cumulative
   P&L's line. */
/* Title pinned to the top, content to the bottom. Alignment across the divider
   comes from that shared structure, not from matching numbers on each side. */
.pnl-net {
  flex:1; min-width:0; display:flex; flex-direction:column;
  gap:0; padding-right:28px; border-right:1px solid var(--bd);
}
.pnl-stats { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:space-between; }

/* The balance block absorbs the spare pixels, so the Net block keeps its
   natural height and sits level with the Month row across the divider. */
.pnl-net > div:first-child { flex:1; min-height:0; display:flex; flex-direction:column; }
.pnl-net > div:last-child  { flex:none; }
/* Balance at broker takes the standard title rhythm, same as Performance and
   Cumulative P&L. Net P&L sits tighter to its figure — it labels the number
   directly beneath it rather than opening a block, and the long gap above is
   what separates the two readings. */
.pnl-net > div > .cbox-l            { margin-bottom:var(--gap-title); }
.pnl-net > div:last-child > .cbox-l { margin-bottom:6px; }
/* No fixed gap: the figure below centres on equal auto margins, so a fixed one
   lands on the top side only and pushes it low. The auto space is never
   smaller. */
.pnl-net > div:first-child > .cbox-l { margin-bottom:0; }
/* Equal auto margins centre the balance figure in whatever the title leaves. */
.pnl-balance-number { margin-top:auto; margin-bottom:auto; }
/* Empty unless there is no balance at all, and left in flow its 6px top margin
   pulls the figure above off centre by 3px. */
.pnl-balance-at:empty { display:none; }

/* A fact, not a verdict — neutral while the net figure below takes the win/loss
   colouring. */
.pnl-balance-number {
  font-size:24px; font-weight:700; line-height:1;
  color:var(--mt2);
}
.pnl-balance-at {
  font-size:8px; letter-spacing:.5px;
  color:var(--mt); margin-top:6px;
}
.pnl-net-number {
  font-size:24px; font-weight:700; line-height:1;
  color:var(--mt2);
}
.pnl-net-number.win  { color:var(--win); }
.pnl-net-number.loss { color:var(--loss); }
.pnl-net-count {
  font-size:8px; color:var(--mt);
  margin-left:8px; letter-spacing:.5px;
}

/* Label left, value right, so the values form one clean edge — and the edge is
   held by an auto margin rather than by space-between, which stops holding the
   moment a row overflows: the figures then start wherever their own label ends,
   so Week and Month land on two different edges because "Week" and "Month" are
   two different widths. Wrapping is the other half. A pair too wide to sit
   beside its label drops to its own line, still against the right, instead of
   running off the card — which is what four- and five-figure weeks do. */
.pnl-stats-grid { display:flex; flex-direction:column; gap:11px; }
.pnl-stat { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 16px; }
.pnl-stat > :last-child { margin-left:auto; }
.pnl-stat-lbl {
  color:var(--mt); white-space:nowrap;
}
.pnl-stat-val {
  font-size:11px; font-weight:600;
  white-space:nowrap; color:var(--mt2);
}
.pnl-stat-val.win  { color:var(--win); }
.pnl-stat-val.loss { color:var(--loss); }

/* Two figures per row, each with its own colour — a losing last week beside a
   winning current one is the point of showing them together, and one class on
   the row could not say it. Tags are quieter than the numbers, and sized a step
   down so the pair clears the label on one line wherever there is room for one.

   Inline text rather than a flex row, because this is the one thing in the card
   that can be too wide for any column it is given: two figures that each grow
   with the account. Inline flow breaks it at the spaces the markup already has
   — after a figure, after the arrow — and NOT between a tag and the figure it
   names, which sit adjacent with no whitespace between them. A flex row breaks
   between any two items, so it would strand `CM` at the end of a line from the
   number it belongs to; nowrap does not break at all, and a pair that cannot
   break widens its own grid column until the card runs off the page.

   line-height:1 because a block's strut is its OWN font size, which here is the
   inherited 13px rather than the 10px of the figures inside it — left alone
   these two rows stand taller than the two above them, and a wrapped line opens
   a gap the single figures never do. */
.pnl-stat-pair { text-align:right; line-height:1; }
.ps-tag {
  font-size:7px; letter-spacing:.5px;
  text-transform:uppercase; color:var(--mt); margin-right:4px;
}
.ps-fig { font-size:10px; font-weight:600; color:var(--mt2); }
.ps-fig.win  { color:var(--win); }
.ps-fig.loss { color:var(--loss); }
/* Reads as "moved from → to". A hyphen against signed figures reads as minus. */
.ps-arrow { font-size:9px; color:var(--mt); margin:0 1px; }

/* ═══════════════════════════════════════════════════════════════════════════
   SYNC STATUS DOT
   ───────────────────────────────────────────────────────────────────────────
   A background sync failure reaches console.error, which on a phone at 6am is
   the same as failing silently. Nearly invisible when everything is fine and
   unmissable when it isn't. Not a toast — a healthy sync happens constantly and
   must never interrupt.
   ═══════════════════════════════════════════════════════════════════════════ */
.sync-dot {
  width:7px; height:7px; border-radius:var(--r-full); flex:none;
  background:var(--mt); opacity:.35; margin-right:4px;
  transition:background .2s, opacity .2s;
}
/* HIDDEN FROM EYES AND NOT FROM ANYTHING ELSE, stated once. Every element here
   is a 1px clipped box that a screen reader still reaches — the sync dot's
   label, and the journal's radios, which must keep their place in the tab order
   and the accessibility tree. `display:none` would take all three out of both. */
.sr-only, .sync-dot-label, .jf-pill-radio {
  position:absolute; width:1px; height:1px;
  overflow:hidden; clip-path:inset(50%); white-space:nowrap;
}
.sync-dot.busy  { background:var(--p);    opacity:.9; animation:brokerPulse 1.4s ease-in-out infinite; }
.sync-dot.ok    { background:var(--win);  opacity:.55; }
/* Amber, not red: a cached copy is a state to notice, not a failure. The
   journal draws normally; only saving is refused. */
.sync-dot.offline { background:var(--warn);  opacity:.95; }
.sync-dot.error { background:var(--loss); opacity:1; }
@media (prefers-reduced-motion:reduce) { .sync-dot.busy { animation:none; } }

/* ═══════════════════════════════════════════════════════════════════════════
   P&L CALENDAR HEATMAP
   ═══════════════════════════════════════════════════════════════════════════ */
/* Three bands stack before the day grid, and each needs its own air or they
   read as one crowded header — looser than the 12px used elsewhere. */
.heatmap-hdr {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px;
}
.heatmap-nav-btn {
  background:var(--s2); border:1px solid var(--bd); color:var(--mt2);
  padding:6px 12px; cursor:pointer; border-radius:var(--r-sm); font-size:14px;
}
.heatmap-nav-btn:hover { border-color:var(--p); background:var(--p-gl); }
.heatmap-title {
  font-size:11px; letter-spacing:1px; text-transform:uppercase;
  color:var(--mt2); font-weight:500;
}

/* ── Year strip ────────────────────────────────────────────────────────────
   Twelve month cells built from the same parts as a day cell one zoom level up:
   result palette in the fill, count above, P&L below, name in the top-left
   corner. All three scales read the same way, so none has to be relearned. The
   open month takes the accent rule, which makes the strip a position marker for
   the grid beneath it. */
/* The seam where the header ends and the calendar begins, so the card reads as
   header / calendar rather than three loose strips. Twelve columns, twelve
   cells — each carries its own name, so there is no header row to keep in step. */
.heatmap-year {
  display:grid; grid-template-columns:repeat(12,1fr); gap:var(--seg-gap);
  margin:0 0 20px;
}

/* The corner name sits inside the cell, so the centred figures need clearance
   beneath it. */
.hm-mo {
  background:var(--cell-bg);
  border:1px solid var(--glass-bd); border-radius:var(--r-cell);
  box-shadow:var(--sh-2); box-sizing:border-box; position:relative;
  padding:7px 2px; min-height:62px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer;
}
.hm-mo.win  { background:var(--seg-win-bg); }
.hm-mo.loss { background:var(--seg-loss-bg); }
.hm-mo.be   { background:var(--seg-be-bg); }
.hm-mo.win:hover  { background:var(--seg-win-hv); }
.hm-mo.loss:hover { background:var(--seg-loss-hv); }
.hm-mo.be:hover   { background:var(--seg-be-hv); }
/* The month on show is outlined in its own result colour and lifted to the
   hover fill, so the strip marks position in the language the rest of the app
   already speaks. A month with no trades has no result to borrow and takes the
   neutral bright rule. */
.hm-mo.sel      { border-color:var(--bd2); }
.hm-mo.sel.win  { border-color:var(--win);  background:var(--seg-win-hv); }
.hm-mo.sel.loss { border-color:var(--loss); background:var(--seg-loss-hv); }
.hm-mo.sel.be   { border-color:var(--seg-be-bd); background:var(--seg-be-hv); }
/* Reserves its line either way, so an empty month keeps a busy one's height and
   the strip stays a straight rule. */
/* A caption under the amount, so lighter weight. The result-coloured rules
   below still override its colour. */
.hm-mo-count {
  font-size:8px; font-weight:400; letter-spacing:.5px;
  color:var(--mt); min-height:12px;
}
.hm-mo.win  .hm-mo-count { color:var(--win); }
.hm-mo.loss .hm-mo-count { color:var(--loss); }
.hm-mo.be   .hm-mo-count { color:var(--be-tx); }
.hm-mo-pnl {
  font-size:10px; font-weight:600; margin-top:2px;
  color:var(--mt2);
}
.hm-mo.win  .hm-mo-pnl { color:var(--win); }
.hm-mo.loss .hm-mo-pnl { color:var(--loss); }
.hm-mo.be   .hm-mo-pnl { color:var(--be-tx); }
/* Seven day columns plus a summary, set apart by a margin so it reads as a rail
   rather than an eighth weekday. */
.heatmap-grid {
  display:grid; grid-template-columns:repeat(7,1fr) minmax(58px,.8fr);
  gap:var(--seg-gap);
}
.heatmap-dow {
  color:var(--mt);
  padding:6px 0; text-align:center;
}
/* Saturday is the one day gold is shut: the week runs Sunday 17:00 New York to
   Friday 17:00, which is the same boundary Dates.weekStart works from. So the
   Saturday heading recedes and Sunday keeps full weight. On a phone the column
   is dropped outright when nothing landed in it, and then there is no heading
   here to dim. */
.heatmap-dow-closed { opacity:.55; }
.heatmap-dow-week, .heatmap-week { margin-left:14px; }
/* A different axis to the weekday names, so it takes the accent. */
.heatmap-dow-week { color:var(--p); }
/* Days outside the month. A wash and no border: the grid keeps its rectangle,
   and nothing here competes with the dashed week rail. */
.heatmap-cell-empty {
  min-height:80px; background:var(--fill-0); border-radius:var(--r-cell);
}
/* Result colour lives in the fill only; borders stay the neutral card rule at
   every state. An outline in the result colour makes the grid a wall of
   competing edges, and the fill plus the coloured figures already carry the
   read. Fills come from --seg-*-bg, so a win is the same green as every bar. */
.heatmap-cell, .heatmap-week {
  background:var(--cell-bg);
  border:1px solid var(--glass-bd); border-radius:var(--r-cell);
  min-height:80px; position:relative; box-sizing:border-box;
  display:flex; flex-direction:column;
}
.heatmap-cell { box-shadow:var(--sh-2); padding:6px; justify-content:center; }
.heatmap-cell.win  { background:var(--seg-win-bg); }
.heatmap-cell.loss { background:var(--seg-loss-bg); }
.heatmap-cell.be   { background:var(--seg-be-bg); }
/* ── Fill intensity ────────────────────────────────────────────────────────
   The result says which way the day went; how strongly it is filled says by how
   much. --hm-i is set per cell by heatmapGrid: the day's |net| against the
   largest |net| in the month on show, floored so the quietest day is still
   plainly coloured. The scale is the month's own, so a calm month is not washed
   out by a loud one elsewhere in the year.

   Mixed rather than tokenised: three fixed bands would need an alpha for every
   band AND every band's hover, twelve tokens for what is one multiplication.
   The flat --seg-*-bg above stays as the fallback declaration, so a browser
   without color-mix() gets exactly what this grid looked like before.

   Break-even is deliberately NOT scaled: a scratch is a day where nothing
   happened, so there is no magnitude to show, and --seg-be-bg is opaque rather
   than an alpha over the card. */
.heatmap-cell.win  { background:color-mix(in srgb, var(--win)  calc(var(--hm-i) * 26%), transparent); }
.heatmap-cell.loss { background:color-mix(in srgb, var(--loss) calc(var(--hm-i) * 26%), transparent); }
/* A flat ten points above whatever the cell already sits at, so hovering a quiet
   day can never land on a loud day's fill. */
.heatmap-cell.win:hover  { background:color-mix(in srgb, var(--win)  calc(var(--hm-i) * 26% + 10%), transparent); }
.heatmap-cell.loss:hover { background:color-mix(in srgb, var(--loss) calc(var(--hm-i) * 26% + 10%), transparent); }
.heatmap-cell.be:hover   { background:var(--seg-be-hv); }
/* Only days that hold a trade are clickable (they open that day's entry). */
.heatmap-cell.win, .heatmap-cell.loss, .heatmap-cell.be { cursor:pointer; }

/* ── Week summary cell ─────────────────────────────────────────────────────
   Same material as a day cell, read-only. Its ordinal sits where a day number
   does — see the shared .heatmap-cell-day rule.

   Dashed, and the only cell in the grid that is: it holds no trade of its own,
   so the broken edge says derived where the day cells say recorded. It also
   carries no --sh-2, which is the same statement in the other register — a
   summary does not sit on the surface the days sit on. */
.heatmap-week {
  padding:6px 4px; align-items:center; justify-content:center;
  border-style:dashed;
}
.heatmap-week.win  { background:var(--seg-win-bg); }
.heatmap-week.loss { background:var(--seg-loss-bg); }
.heatmap-week.be   { background:var(--seg-be-bg); }
.heatmap-week-count {
  font-size:7px; font-weight:400; letter-spacing:.5px;
  color:var(--mt); text-transform:uppercase;
}
.heatmap-week.win  .heatmap-week-count { color:var(--win); }
.heatmap-week.loss .heatmap-week-count { color:var(--loss); }
.heatmap-week.be   .heatmap-week-count { color:var(--be-tx); }
.heatmap-week-pnl {
  font-size:11px; font-weight:600; margin-top:3px;
  color:var(--mt2);
}
.heatmap-week.win  .heatmap-week-pnl { color:var(--win); }
.heatmap-week.loss .heatmap-week-pnl { color:var(--loss); }
.heatmap-week.be   .heatmap-week-pnl { color:var(--be-tx); }
/* Day number, week ordinal and month name are one thing at three scales — the
   cell's identity, pinned to its top-left corner. */
.heatmap-cell-day, .heatmap-week-lbl, .hm-mo-lbl {
  position:absolute; top:6px; left:8px;
  font-size:10px; color:var(--mt); font-weight:500;
}
.heatmap-cell-body {
  text-align:center; flex:1; width:100%;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
/* Today. Not the accent — purple already means unfinished on this grid — so the
   day number takes the brightest text tone instead, which is the one step the
   corner labels have left. */
.heatmap-cell.today .heatmap-cell-day { color:var(--tx); font-weight:600; }
/* Count then amount, largest first: the amount carries the weight and the count
   sits above it as a caption. */
.heatmap-cell-count {
  font-size:7px; font-weight:400; letter-spacing:.5px;
  color:var(--mt); text-transform:uppercase;
}
.heatmap-cell.win  .heatmap-cell-count { color:var(--win); }
.heatmap-cell.loss .heatmap-cell-count { color:var(--loss); }
.heatmap-cell.be   .heatmap-cell-count { color:var(--be-tx); }
.heatmap-cell-pnl {
  font-size:11px; font-weight:600; margin-top:3px;
  color:var(--mt2); text-transform:uppercase;
}
.heatmap-cell.win  .heatmap-cell-pnl { color:var(--win); }
.heatmap-cell.loss .heatmap-cell-pnl { color:var(--loss); }
.heatmap-cell.be   .heatmap-cell-pnl { color:var(--be-tx); }
/* Reuses .pm-lbl / .pm-val from the wheel money strips — same kind of figure,
   same typography. */
.heatmap-month-pnl {
  display:flex; justify-content:center; align-items:baseline;
  gap:22px; margin:-4px 0 20px;
}
.heatmap-month-stat { display:inline-flex; align-items:baseline; gap:6px; }

/* ═══════════════════════════════════════════════════════════════════════════
   TRADE LOG
   ═══════════════════════════════════════════════════════════════════════════ */
.tlog-wrap {
  background:var(--glass); border:1px solid var(--glass-bd); margin-bottom:var(--gap-section);
  border-radius:var(--r-md); box-shadow:var(--sh-2); overflow:hidden;
}
.tlog-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 18px; white-space:nowrap;
}
/* Entry clock beneath the date in a log row. */
.tlog-time {
  display:block; margin-top:2px;
  font-size:9px; letter-spacing:.5px; color:var(--mt);
}
/* Only renders above one page, so collapse the empty bar — otherwise it leaves
   a gap above the column titles that no other section has. */
.tlog-hdr:has(.tlog-pagination:empty) { display:none; }
.tlog-pagination {
  display:flex; align-items:center; gap:6px;
}
.tlog-pag-info {
  font-size:8px; color:var(--mt);
}
.tlog-pag-btn {
  font-size:8px;
  padding:3px 10px; border:1px solid var(--bd);
  background:transparent; color:var(--mt2); cursor:pointer;
}
.tlog-pag-btn:disabled { opacity:.4; cursor:default; }
/* Stops the header underline and row separators 18px from the card edge, like
   the inset lines everywhere else. First/last cell padding is zeroed below so
   text still lands on that edge. */
.tw { overflow-x:auto; padding:0 18px; }
.empty-msg {
  padding:26px 0 30px; text-align:center;
  font-size:11px; line-height:1.7; color:var(--mt);
}

/* ═══════════════════════════════════════════════════════════════════════════
   LOG + ROLL-FORWARD SPLIT
   ───────────────────────────────────────────────────────────────────────────
   The log takes the wider half: its table has a fixed column count, while the
   roll-forward is a label/value list that only grows whitespace if given more.
   align-items:stretch squares the two off, and the roll-forward's surplus height
   goes into the gaps between its rows rather than a void beneath the last.
   ═══════════════════════════════════════════════════════════════════════════ */
.log-split {
  display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);
  gap:var(--gap-section); align-items:stretch; margin-bottom:var(--gap-section);
}
/* The grid gap owns the spacing; a bottom margin here adds a phantom row inside
   the grid cell. */
.log-split > .tlog-wrap { margin-bottom:0; }

/* Fills the log's height: a short summary column beside a tall table reads as
   an accident. The groups below take the slack between rows, not under the
   last. */
.roll-card {
  display:flex; flex-direction:column;
  /* Both figures right-align in their own column, so the visible distance is
     this gap plus the right column's slack. At 10px two seven-digit figures
     read as one run-on number. */
  --roll-gap:24px;
}
/* A passthrough: it must carry the flex chain or the body below has no surplus
   height to distribute. */
.roll-card > #roll-forward { flex:1; display:flex; flex-direction:column; }
.roll-body { flex:1; display:flex; flex-direction:column; gap:var(--gap-divider); }

/* Label, this month, last month. A grid rather than .pnl-stat's flex row: the
   two figure columns have to land on the same edges in .roll-list and .roll-
   memo, which are separate containers, and space-between cannot promise that
   across both.

   Fractions, not pixels. Content-sized columns would each fit their own
   content, putting the memo's "3" under Trades somewhere different from the
   list's "1284.50". A fixed width would hand every spare pixel on a wide card
   to the label and huddle the figures at the right edge. 2fr still leaves the
   label the most room — it carries the longest string in the panel. */
.roll-row {
  display:grid; grid-template-columns:2fr 1fr 1fr;
  align-items:baseline; gap:var(--roll-gap);
}
/* A grid has to be told to put the value on the right edge; flex does it free. */
.roll-row .pnl-stat-val { text-align:right; }

/* The accent marks the range being reported, as it does on the nav tab and carousel
   dot. Last month is a benchmark, so it takes the same type muted. */
.roll-range {
  font-weight:600;
  color:var(--p);
  text-align:right;
}
.roll-range.prior { color:var(--mt); }
/* A floor, not the gap: space-between spreads the rows over whatever height the
   log gives, and this only takes over when there is no slack left. */
.roll-list {
  flex:1; display:flex; flex-direction:column;
  justify-content:space-between; gap:11px;
}

/* Heavier and ruled off: the one figure in the block that is a RESULT rather
   than a term in the sum producing it. */
.roll-total { margin-top:var(--gap-divider); padding-top:var(--gap-divider); border-top:1px solid var(--glass-bd); }
.roll-total .pnl-stat-lbl { color:var(--mt2); }
.roll-total .pnl-stat-val { font-size:14px; }

/* Below the rule is context, NOT arithmetic. The four lines above reconcile
   exactly (start + profit − loss = end), and a fifth term would break an
   identity meant to be checkable by eye. */
.roll-memo {
  flex:1; padding-top:var(--gap-divider);
  border-top:1px solid var(--glass-bd);
  display:flex; flex-direction:column;
  justify-content:space-between; gap:11px;
}
.roll-memo-title { margin-bottom:2px; }
/* A placeholder, not a reading — dimmed so it is never taken for a real zero.
   Scoped so the shared .pnl-stat-val is untouched. */
.roll-card .pnl-stat-val.dim { color:var(--mt2); }

/* ═══════════════════════════════════════════════════════════════════════════
   TABLE
   ═══════════════════════════════════════════════════════════════════════════ */
table { width:100%; border-collapse:collapse; }
thead th {
  color:var(--mt); padding:16px 12px 10px; text-align:left;
  border-bottom:1px solid var(--glass-bd); background:transparent; white-space:nowrap;
}
th:first-child, td:first-child { padding-left:0; }
th:last-child,  td:last-child  { padding-right:0; }
thead th.c { text-align:center; }
tbody tr {
  border-bottom:1px solid var(--p-hair);
 cursor:pointer;
}
tbody tr:hover { background:var(--row-hv); }
td {
  padding:9px 12px; font-size:10px;
  color:var(--mt2); white-space:nowrap; text-transform:uppercase;
}
td.win { color:var(--win); }
td.loss{ color:var(--loss); }
td.c   { text-align:center; }

.dir-pill {
  display:inline-block; font-size:8px; letter-spacing:1px;
  padding:3px 9px; text-transform:uppercase; font-weight:600; border-radius:var(--r-full);
  color:var(--mt2); background:var(--fill-1); border:1px solid var(--glass-bd);
}
.del-btn {
  background:none; border:none; color:var(--loss); cursor:pointer;
  font-size:12px; padding:2px 5px; opacity:.4;
}
.del-btn:hover { opacity:1; }
.rules-tick { color:var(--win); }
.rules-cross { color:var(--loss); }
/* A full + initials pair; the phone stylesheet flips which is visible. */
.setup-abbr { display:none; }

/* ═══════════════════════════════════════════════════════════════════════════
   SETUP DONUTS (per-setup win rate)
   ═══════════════════════════════════════════════════════════════════════════ */
.setup-donut-row {
  display:grid; grid-template-columns:1fr 1fr; gap:0;
}
.setup-donut-col {
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:0 14px;
}
.setup-donut-col + .setup-donut-col { border-left:1px solid var(--glass-bd); }
/* Beneath the wheel, divided like the period columns and reusing the session
   win-rate bars. */
.setup-sess {
  width:100%; margin-top:8px; padding-top:var(--gap-divider);
  border-top:1px solid var(--glass-bd);
}
.setup-donut-label { align-self:flex-start; }

/* ═══════════════════════════════════════════════════════════════════════════
   SESSION WIN-RATE BARS (win/loss split, green/red)
   ═══════════════════════════════════════════════════════════════════════════ */
.sess-wr-list { display:flex; flex-direction:column; gap:14px; padding:6px 2px 2px; }
.sess-wr-row  { display:grid; grid-template-columns:46px 1fr 38px; align-items:center; gap:10px; }
.sess-wr-label { text-align:left; }
.sess-wr-track {
  height:var(--bar-h); border-radius:3px; overflow:hidden;
  display:flex; gap:var(--seg-hair);
}
.sess-wr-seg-win {
  background:var(--seg-win-bg); border:var(--seg-bd) solid var(--win);
  box-sizing:border-box;
}
.sess-wr-seg-loss {
  background:var(--seg-loss-bg); border:var(--seg-bd) solid var(--loss);
  box-sizing:border-box;
}
.sess-wr-seg-be {
  background:var(--seg-be-bg); border:var(--seg-bd) solid var(--seg-be-bd);
  box-sizing:border-box;
}
.sess-wr-track.first .sess-wr-seg-win  { border-radius:3px 0 0 3px; }
.sess-wr-track .sess-wr-seg-last       { border-radius:0 3px 3px 0; }
.sess-wr-track.solo > *                { border-radius:3px; }
.sess-wr-pct {
  font-size:10px; font-weight:500; text-align:left;
}
.sess-wr-pct.win  { color:var(--win); }
.sess-wr-pct.loss { color:var(--loss); }
.sess-wr-pct.dim  { color:var(--mt2); }
/* The track every bar shows when it has nothing to plot — a break-even segment
   dimmed to .4, so the empty panel is uniform. */
.bar-empty {
  width:100%; height:var(--bar-h); border-radius:3px; box-sizing:border-box;
  background:var(--seg-be-bg); border:var(--seg-bd) solid var(--seg-be-bd);
  opacity:.4;
}

/* ═══════════════════════════════════════════════════════════════════════════
   JOURNAL MODAL
   ═══════════════════════════════════════════════════════════════════════════ */
.journal-modal {
  display:none; position:fixed; inset:0;
  background:var(--scrim);
  z-index:400; overflow-y:auto;
  padding:24px 20px;
}
.journal-modal.open { display:flex; }
/* The containing block for the form's visually-hidden radios, which are
   absolutely positioned. */
.journal-modal-card {
  width:fit-content; max-width:100%; margin:auto;
  position:relative;
}
/* Bordered floating boxes with no outer card, so each thing recorded reads as
   its own panel. */
.jm-card {
  width:100%; border:1px solid var(--bd); border-radius:var(--r-md);
  background-color:var(--bg);
  background-image:var(--aura);
  background-attachment:fixed; background-repeat:no-repeat;
  padding:15px 18px;
  /* The only two rows in the modal, so they take more air than a row in a dense
     panel would. */
  display:flex; flex-direction:column; align-items:center; gap:24px;
}

/* ═══════════════════════════════════════════════════════════════════════════
   JOURNAL FORM
   ═══════════════════════════════════════════════════════════════════════════ */
.journal-form { display:flex; flex-direction:column; align-items:center; width:100%; }
/* Sits directly on its buttons rather than opening a block, so it drops the
   shared label gap. */
.jf-yn-item .journal-q-label { margin-bottom:0; }

/* Different shapes, different gaps. A Y/N item is a label over two pills and
   already reads as one block, so it takes the wider separation to stay one; two
   single setup pills at that gap drift apart instead of reading as a choice.
   The ratio inverts on mobile — see the breakpoint. */
.jf-yn-row {
  display:flex; gap:30px; justify-content:center; flex-wrap:wrap;
}
.jf-yn-item {
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.jf-yn-buttons { display:flex; gap:6px; }

.jf-setup-row {
  display:flex; justify-content:center; gap:22px;
}

.journal-q-label {
  color:var(--mt2); margin-bottom:12px; display:block;
}
/* The label carries the whole appearance — the input itself is hidden by
   `.sr-only` above rather than by display:none, which would leave every answer
   mouse-only. */
/* :focus-visible, not :focus — a mouse click never triggers it. */
.jf-pill-radio:focus-visible + .jf-pill-lbl {
  outline:2px solid var(--p); outline-offset:2px;
}
.jf-pill-lbl {
  font-size:9px; letter-spacing:.3px; text-transform:uppercase;
  padding:6px 12px; border:1px solid var(--glass-bd);
  color:var(--pill-tx); cursor:pointer;
  border-radius:var(--r-full); background:var(--fill-1); white-space:nowrap;
}
.jf-yn-pill  { width:56px; text-align:center; display:inline-block; }
.jf-pill-lbl:hover { border-color:var(--bd-hi); color:var(--tx-max); background:var(--fill-2); }
.jf-pill-radio:checked + .jf-pill-lbl {
  border-color:var(--p); color:var(--tx-hi); background:var(--p-gl2); box-shadow:0 0 16px -4px var(--p-gl3);
}

.journal-form-actions {
  display:flex; gap:10px; margin-top:22px; padding-bottom:8px;
  justify-content:center;
}
.jm-btn-save {
  background:var(--p); border:1px solid var(--p); color:var(--tx-max);
  cursor:pointer;
  padding:9px 0; border-radius:var(--r-full);
  width:110px;
}
.jm-btn-save:hover { background:var(--p); border-color:var(--p); box-shadow:0 0 22px -4px var(--p-gl3); }
.jm-btn-cancel {
  background:var(--fill-1); border:1px solid var(--bd2); color:var(--mt2);
  cursor:pointer;
  padding:9px 0; border-radius:var(--r-full);
  width:110px;
}
.jm-btn-cancel:hover { background:var(--fill-3); border-color:var(--bd2); color:var(--tx); }

/* ═══════════════════════════════════════════════════════════════════════════
   DAY PICKER POPUP  (calendar day with 2+ trades)
   ═══════════════════════════════════════════════════════════════════════════ */
.day-modal {
  display:none; position:fixed; inset:0;
  background:var(--scrim);
  z-index:500; align-items:center; justify-content:center; padding:20px;
}
.day-modal.open { display:flex; }
.day-modal-card {
  background:var(--bg);
  border:1px solid var(--glass-bd);
  width:100%; max-width:420px;
  border-radius:var(--r-lg); box-shadow:var(--sh-3); overflow:hidden;
}
.day-modal-hdr {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 20px; border-bottom:1px solid var(--bd);
}
.day-modal-title {
  font-size:9px; letter-spacing:2px; text-transform:uppercase;
  color:var(--mt2);
}
.day-modal-body {
  padding:20px; display:flex; flex-direction:column; gap:14px;
  max-height:80vh; overflow-y:auto;
}
/* Matched on the ID: the element carries no class, so a class selector here
   silently colours nothing. */
#day-modal-title .win  { color:var(--win); }
#day-modal-title .loss { color:var(--loss); }
.day-trade-list { display:flex; flex-direction:column; gap:8px; }
.day-trade-row {
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:11px 13px; border:1px solid var(--bd); border-radius:var(--r-md);
  background:var(--fill-0); cursor:pointer;
}
.day-trade-row:hover { border-color:var(--p); background:var(--p-gl); }
.day-trade-left { display:flex; align-items:center; gap:10px; min-width:0; }
.day-trade-meta { display:flex; flex-direction:column; gap:3px; min-width:0; }
.day-trade-setup {
  font-size:12px; color:var(--tx);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.day-trade-sub {
  color:var(--mt2);
}
.day-trade-pnl { font-size:13px; font-weight:600; flex-shrink:0; }
.day-trade-pnl.win  { color:var(--win); }
.day-trade-pnl.loss { color:var(--loss); }

/* ═══════════════════════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════════════════════ */
.notif {
  position:fixed; bottom:22px; right:22px;
  background:var(--bg);
  border:1px solid var(--p); color:var(--p);
  font-size:10px; padding:11px 18px;
  border-radius:var(--r-full); box-shadow:var(--sh-3);
  z-index:600; opacity:0;
  pointer-events:none;
}
.notif.show { opacity:1; pointer-events:auto; }
.notif.err { border-color:var(--loss); color:var(--loss); }
/* Inline Undo button carried by the delete toast (see notifyUndo). */
.notif-undo {
  margin-left:12px; padding:3px 11px; cursor:pointer;
  background:transparent; color:var(--p); border:1px solid var(--p);
  border-radius:var(--r-full);
}
.notif-undo:hover { background:var(--p-gl2); }

/* ═══════════════════════════════════════════════════════════════════════════
   BOOT STATE
   ───────────────────────────────────────────────────────────────────────────
   Covers the gap between "page parsed" and "first render", and the dead end
   where a CDN never answered. Sits above the panel and below every modal, so
   the login overlay still takes precedence when there is no session.
   ═══════════════════════════════════════════════════════════════════════════ */
/* Two equal outer rows put the status line on the true centre, with the mark
   standing on it from above, rather than centring the pair and leaving the
   line wherever the mark's height pushes it. */
.boot-msg {
  position:fixed; inset:0; z-index:300;
  display:grid; grid-template-rows:1fr auto 1fr; justify-items:center; gap:20px;
  background:var(--bg);
  font-size:10px; letter-spacing:1px;
  text-transform:uppercase; color:var(--mt);
  text-align:center; padding:24px;
}
.boot-msg.done { display:none; }
.boot-msg .brand-mark { align-self:end; }

   the sign-in card cannot drift apart. Inlined rather than fetched: this is the

.boot-line { display:flex; align-items:center; justify-content:center; gap:10px; }
/* Reuses the sync dot's pulse so the two "working" signals are one language. */
.boot-dot {
  width:7px; height:7px; border-radius:var(--r-full); flex:none;
  background:var(--p); opacity:.9;
  animation:brokerPulse 1.4s ease-in-out infinite;
}
.boot-msg.failed .boot-dot { background:var(--loss); animation:none; }
.boot-msg.failed #boot-text { color:var(--loss); text-transform:none; letter-spacing:.5px; }
@media (prefers-reduced-motion:reduce) { .boot-dot { animation:none; } }

/* ═══════════════════════════════════════════════════════════════════════════
   LOGIN OVERLAY
   ═══════════════════════════════════════════════════════════════════════════ */
.login-overlay {
  display:none; position:fixed; inset:0; z-index:500;
  background:var(--bg);
  align-items:center; justify-content:center; padding:24px;
}
.login-overlay::before {
  content:''; position:absolute; inset:0; pointer-events:none;
  background:var(--aura);
}
.login-overlay.open { display:flex; }
.login-card {
  position:relative; width:100%; max-width:320px;
  display:flex; flex-direction:column; gap:12px;
  background:var(--glass);
  border:1px solid var(--glass-bd); border-radius:var(--r-lg);
  box-shadow:var(--sh-3);
  padding:32px 28px 28px;
}
.login-card .brand-mark { align-self:center; }
.login-sub {
  text-align:center; margin-bottom:10px;
  color:var(--mt);
}
.login-input {
  /* 16px is the iOS auto-zoom threshold: Safari zooms on focusing anything
     smaller and never zooms back. These are the only text fields left in the
     app, so keeping them at or above it removes the behaviour entirely rather
     than needing code to suppress it. */
  font-size:16px; letter-spacing:.5px;
  padding:11px 14px; border:1px solid var(--glass-bd);
  color:var(--tx); border-radius:var(--r-sm); background:var(--fill-1);
  width:100%; outline:none;
}
.login-input:focus { border-color:var(--p); background:var(--p-gl); box-shadow:0 0 16px -4px var(--p-gl3); }
.login-btn { width:100%; padding:11px 0; margin-top:4px; border-radius:var(--r-sm); }
.login-btn[disabled] { opacity:.5; cursor:default; }
.login-err {
  min-height:14px; text-align:center;
  font-size:9px; letter-spacing:.5px; color:var(--loss);
}

/* ═══════════════════════════════════════════════════════════════════════════
   BROKER SYNC — pending-entry states
   A synced trade that still lacks its setup and rules data is flagged in
   purple wherever it appears (banner, heatmap cell, trade-log row). Once the
   entry is completed the flag clears and everything reverts to the journal's
   normal colours.
   ═══════════════════════════════════════════════════════════════════════════ */
.broker-banner {
  display:flex; align-items:center; gap:10px;
  margin-bottom:var(--gap-section); padding:12px 16px; cursor:pointer;
  background:var(--pend-gl2); border:1px solid var(--pend); border-radius:var(--r-md);
  color:var(--tx-hi); font-size:12px;
  animation:brokerPulse 2.4s ease-in-out infinite;
}
.broker-banner b { color:var(--pend); font-size:11px; letter-spacing:.5px; }
.broker-banner .broker-banner-cta {
  margin-left:auto;
  color:var(--pend); white-space:nowrap;
}
@keyframes brokerPulse {
  0%, 100% { box-shadow:0 0 0 0 transparent; }
  50%      { box-shadow:0 0 18px -2px var(--pend-gl3); }
}
/* Purple outright, not a P&L colour with a purple edge: the flag says
   unfinished, not won or lost. After the .win/.loss/.be fills, so it overrides
   on equal specificity. */
.heatmap-cell.pending {
  background:var(--pend-gl3);
  border-color:var(--pend);
  cursor:pointer;   /* a pending day may carry no result class of its own yet */
  animation:brokerPulse 2.4s ease-in-out infinite;
}
.heatmap-cell.pending:hover { background:var(--pend-gl4); }

tr.broker-pending td { background:var(--pend-gl); }
/* An inset shadow, not a border, so it consumes no layout width and the padding
   does the spacing alone. */
tr.broker-pending td:first-child {
  box-shadow:inset 3px 0 0 var(--pend);
  padding-left:14px;
}
@media (prefers-reduced-motion:reduce) {
  .broker-banner, .heatmap-cell.pending { animation:none; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   MOBILE LAYER (≤640px)
   One breakpoint. Multi-column analytic rows become horizontal swipe carousels:
   native CSS scroll-snap, one column per swipe, position persisted across
   re-renders by the Carousel module. Companion pairs (.grid-2) stack instead —
   two halves of one card, not siblings to flick through.
   ═══════════════════════════════════════════════════════════════════════════ */
/* Styled in the base layer, shown only in the mobile layer where the analytic
   rows become carousels. */
.snap-dots { display:none; }
.snap-dot {
  width:6px; height:6px; border-radius:50%;
  background:var(--bd2); border:none; padding:0; cursor:pointer;
  transition:background .2s;
}
.snap-dot.on { background:var(--p); }
@media (max-width:640px) {
  .panel { padding:18px 14px; }
  nav { padding:0 16px; }

  /* Companion boxes stack */
  .grid-2 { grid-template-columns:1fr; }
  /* And so do the P&L card's own two halves. Side by side on a phone the
     performance half is about 135px, which a four-figure week overruns before
     wrapping can help — the pair on its own is wider than the column. Full
     width each, and the divider turns with them. */
  .pnl-card-inner { flex-direction:column; gap:16px; }
  /* The two readings inside it turn the other way, into the width the stack was
     leaving empty. Two short figures fit a half each where the performance pair
     could not, and side by side they read as the one comparison they are: what
     the broker holds, against what the journal has made of it.

     Both titles take the standard rhythm here. Stacked, Balance at broker
     opened a block and Net P&L sat tight on its own figure, and across two
     columns that difference alone lands the two figures on different lines.
     The balance figure drops its auto margins for the same reason: they centre
     it in a column stretched to the height of the taller one, which is that
     misalignment from the other side. */
  .pnl-net {
    flex-direction:row; gap:16px; padding-right:0; padding-bottom:16px;
    border-right:none; border-bottom:1px solid var(--bd);
  }
  /* And the net reading turns to face the right edge, where the performance
     figures below it already sit. Stacked, these are the two things on the
     card's right-hand side, and one starting edge and one ending edge read as
     two columns that nearly line up rather than as one. */
  .pnl-net > div:last-child { flex:1; text-align:right; }
  .pnl-net > div:first-child > .cbox-l,
  .pnl-net > div:last-child  > .cbox-l { margin-bottom:var(--gap-title); }
  .pnl-balance-number { margin-top:0; margin-bottom:0; }
  /* Side by side would leave the table roughly 140px wide. Source order is
     kept, so the roll-forward lands beneath the log. */
  .log-split { grid-template-columns:1fr; }

  /* Fullscreen does nothing on a phone and the API is unreliable on iOS.
     Hidden rather than removed so desktop keeps it. */
  #nav-fs-btn { display:none; }

  /* Two rows of six: quarters land in whole rows, cells stay tappable. */
  .heatmap-year { grid-template-columns:repeat(6,1fr); }
  .hm-mo { min-height:58px; padding:6px 2px; }

  /* ── Carousels ── */
  .period-row, .setup-donut-row {
    display:grid; grid-auto-flow:column; grid-auto-columns:100%;
    grid-template-columns:none;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .period-row::-webkit-scrollbar, .setup-donut-row::-webkit-scrollbar { display:none; }
  .period-col, .setup-donut-col {
    scroll-snap-align:center; scroll-snap-stop:always;
    min-width:0;
  }
  /* Column dividers read as card edges mid-swipe — drop them on mobile. */
  .period-col, .setup-donut-col + .setup-donut-col { border-left:none; }

  /* 16px above the dots and 16px below, in every carousel. .cbox cards get it
     from the dots' own top padding plus the card's bottom padding; .period-
     card's row already ends with 16px, so the dots add 0 above. */
  .snap-dots {
    display:flex; justify-content:center; gap:6px;
    padding:16px 0 0;
  }
  .period-card .snap-dots { padding:0 0 16px; }

  /* Tighter cells so a full month fits. "trade(s)" is dropped — inside a month
     grid the bare count is unambiguous, and it frees room for the P&L. */
  .heatmap-cell, .heatmap-cell-empty, .heatmap-week { min-height:52px; }
  .heatmap-cell, .heatmap-week { padding:4px; }   /* radius stays --r-cell */
  .heatmap-cell-day, .heatmap-week-lbl { font-size:8px; top:4px; left:5px; }
  .heatmap-cell-count { font-size:8px; letter-spacing:0; }
  .heatmap-cell-count-word { display:none; }
  .heatmap-cell-pnl   { font-size:9px; margin-top:2px; }
  /* The week rail shrinks to the minimum that still fits its figures, and its
     separating margin comes in with it. */
  .heatmap-grid { grid-template-columns:repeat(7,1fr) minmax(34px,.62fr); gap:2px; }
  /* Saturday dropped: six days share the freed width and the week rail widens. */
  .heatmap-grid.no-sat { grid-template-columns:repeat(6,1fr) minmax(44px,.8fr); }
  .heatmap-dow-week, .heatmap-week { margin-left:8px; }
  /* Four pairs exceed a phone's width, so they wrap rather than overflow. */
  .heatmap-month-pnl { gap:12px; flex-wrap:wrap; row-gap:6px; }
  .heatmap-dow-week   { font-size:7px; letter-spacing:0; }
  .heatmap-week-count { font-size:8px; letter-spacing:0; }
  .heatmap-week-pnl   { font-size:8px; margin-top:2px; }
  .hm-mo-count { font-size:10px; }
  .hm-mo-pnl   { font-size:9px; }
  /* The largest figure in the narrowest column, so the cents push it out of
     shape. Dropped in CSS, not rounded in JS — the value stays exact. */
  .hm-cents { display:none; }

  /* ── The month cell reserves its label row at all times ─────────────────
     A 10px name over a 58px box leaves little clear height, so anything centred
     on the BOX reads as crammed against it. Reserving the label row as padding
     moves the centring axis into the space below. Day and week cells are roomier
     and reserve the row in their own rule below. */
  .hm-mo { padding-top:18px; }

  /* ── Heatmap cells (phone) ──────────────────────────────────────────────
     The count moves to the corner OPPOSITE the label, leaving the middle to the
     amount alone. Each count mirrors ITS OWN label's offsets and size rather
     than one shared set — that is what puts it on the same line as the name
     across from it. Counts keep the result palette; the labels stay muted. */
  .heatmap-cell-count,
  .heatmap-week-count {
    position:absolute; top:4px; right:5px;
    font-size:8px; min-height:0; margin:0;
  }
  .hm-mo-count {
    position:absolute; top:6px; right:8px;
    font-size:10px; min-height:0; margin:0;
  }
  /* Sole occupant of the middle, so it carries the weight alone. */
  .heatmap-cell-pnl,
  .heatmap-week-pnl,
  .hm-mo-pnl { font-size:10px; margin-top:0; }
  /* Day and week reserve their label row here only — see .hm-mo above. */
  .heatmap-cell-body { padding-top:10px; }
  .heatmap-week { padding-top:14px; }

  /* Trade log: phone shows the identity columns only — Date, Dir, Session,
     Setup, P&L. Rules/SL/TP and delete live in the entry itself (tap the
     row); no sideways scrolling. Setup flips to its initials form (B&R / S&R)
     and cell padding tightens so all 5 columns land inside the screen. */
  .tlog-wrap th:nth-child(n+6), .tlog-wrap td:nth-child(n+6) { display:none; }
  .setup-full { display:none; }
  .setup-abbr { display:inline; }
  .tw { padding:0 14px; }
  td, thead th { padding-left:6px; padding-right:6px; }

  /* Pop-ups: tighter shells so every card sits fully inside the viewport. */
  .day-modal { padding:14px 10px; }
  .day-modal-body { padding:16px 14px; }

  /* Journal modal: full-bleed card. */
  .journal-modal { padding:12px 8px; overflow-x:hidden; }
  .journal-modal-card { width:100%; max-width:100%; }

  /* Wide control rows must never spill past the card edge, so each becomes a
     swipe strip: centred while it fits, left-anchored and scrollable once it
     does not. flex- start is load-bearing — centring an overflowing flex row
     clips its start unscrollably. */
  .jm-card { padding:14px 10px; overflow:hidden; }
  .jf-yn-row, .jf-setup-row, .journal-form-actions {
    max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch;
    justify-content:flex-start; flex-wrap:nowrap;
    scrollbar-width:none; padding-bottom:2px;
  }
  .jf-yn-row::-webkit-scrollbar, .jf-setup-row::-webkit-scrollbar,
  .journal-form-actions::-webkit-scrollbar { display:none; }
  .jf-yn-row > *, .jf-setup-row > *, .journal-form-actions > * { flex-shrink:0; }
  /* Centre each strip while it fits, collapse to 0 once it overflows. The setup
     pills are the pair that can outgrow the narrowest phones. */
  .jf-yn-row > :first-child, .jf-setup-row > :first-child,
  .journal-form-actions > :first-child { margin-left:auto; }
  .jf-yn-row > :last-child, .jf-setup-row > :last-child,
  .journal-form-actions > :last-child { margin-right:auto; }
  /* Both rows tighten, and the Y/N gap stays the wider of the two for the same
     reason as desktop — three blocks need more separating than two pills. The
     pills give back that width, which is what keeps all three questions on one
     row without swiping. */
  .jf-yn-row { gap:25px; }
  .jf-setup-row { gap:21px; }
  .jf-yn-pill { width:44px; }

  .journal-form-actions { gap:8px; width:100%; }
  .jm-btn-save, .jm-btn-cancel { width:auto; min-width:92px; padding:9px 14px; }
}
</style>
</head>
<body>

<!-- Boot state. Without it the panel goes from empty to full through a gap
     showing a dashboard of em-dashes — indistinguishable from "connected, no
     trades". It also covers an unreachable CDN, which throws at Data.init()
     before anything renders.

     First in the body, deliberately: the browser paints as it parses, so an
     overlay declared after what it covers can be a frame late. Stacking here is
     decided by z-index, never source order — this covers 0–60, and everything
     above it is 400–600. -->
<div id="boot-msg" class="boot-msg">
  <span class="brand-mark"></span>
  <span class="boot-line">
    <span class="boot-dot"></span>
    <span id="boot-text">Loading your journal…</span>
  </span>
</div>

<nav>
  <div class="logo">DOJI</div>
  <div class="nav-actions">
    <span id="sync-dot" class="sync-dot" role="status" aria-live="polite"
          title="Sync status"><span class="sync-dot-label"></span></span>
    <button id="nav-fs-btn" class="nav-icon-btn" title="Toggle fullscreen" aria-label="Toggle fullscreen">
      <svg class="fs-ico-enter" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      <!-- Four brackets pointing inward. Each is one absolute subpath with
           sweep-flag 1, so all four curve the same way — a mixed sweep or a
           relative move between subpaths turns one inside out. -->
      <svg class="fs-ico-exit" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M16 21v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
    </button>
  </div>
</nav>

<h1 class="sr-only">Doji — XAUUSD trading journal</h1>
<main class="panels">

  <!-- ═══ TRADES ═══ -->
  <div class="panel">

    <!-- Shown while any synced trade still lacks its journal answers. Tapping
         it opens the oldest. -->

    <!-- No section title: the card labels its own parts, so a heading would

            <div>

              <div class="pnl-stat"><span class="pnl-stat-lbl">Gross Loss</span><span id="pnl-gross-loss" class="pnl-stat-val">—</span></div>

<div class="notif" id="notif"></div>

<!-- jsDelivr mirrors the npm artifacts byte-for-byte, so the SRI hash below can
     be recomputed straight from the official tarball. chart.umd.js in 4.4.0 IS
     the minified build — npm ships no separate .min for it. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"
  integrity="sha512-6HrPqAvK+lZElIZ4mZ64fyxIBTsaX5zAFZg2V/2WT+iKPrFzTzvx6QAsLW2OaLwobhMYBog/+bvmIEEGXi0p1w=="
  crossorigin="anonymous"></script>
<!-- Pinned, deliberately without an SRI hash — separate defences, and only one
     is worth its cost here. A floating @2 would let jsDelivr serve whatever
     Supabase shipped last; the exposure that matters is not a supply-chain
     attack but DRIFT, the client changing behaviour overnight with nothing to
     point at. Pinning closes that for one character.

     A hash would also prove the bytes untampered, but it needs recomputing on
     every bump and a forgotten one fails closed with no message. Chart.js
     carries one because it is effectively frozen; this one moves.
     Add one here if this ever leaves a single-user setting. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"
  crossorigin="anonymous"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   DOJI — XAUUSD trading journal

   A trade is one row in one table. The broker fills in what it knows, the trader
   fills in what only they know, and neither writes the other's columns.

     CONFIG     frozen domain values
     Dates      formatting, NY wall clock, session and week boundaries
     Derive     the four things read off a row rather than stored on it
     Stats      pure arithmetic over a list of rows
     Data       Supabase: load, save, delete, realtime, offline snapshot
     Charts     Chart.js wrappers and the four shared visual primitives
     Render     one function per component, orchestrated by render()
     Journal    the entry modal
     Login      session gate
     Mobile     carousel, zoom lock, keyboard inset
     boot       wiring and start

   Column names are the database's, unchanged — one vocabulary end to end.
   ═══════════════════════════════════════════════════════════════════════════ */

const SUPABASE = {
  URL: 'https://gujhyogvkzjgnrodyuse.supabase.co',
  KEY: 'sb_publishable_qDYX9YI-F8zrTYs0Vw5nhA_gNuYWsyL'
};

const CONFIG = Object.freeze({
  // The three windows the wheel row reports, in display order. `key` is what
  // periodStart() switches on and what every generated id is built from, so
  // this list is the whole definition of the row.
  PERIODS: [
    { key: 'month', label: 'This Month' },
    { key: 'week',  label: 'This Week'  },
    { key: 'total', label: 'All Time'   }
  ],

  SESSIONS: ['Asian','Asia+London','London','London+NY','New York'],
  SESSION_ABBR: { 'Asian':'AS', 'Asia+London':'AS+LN', 'London':'LN', 'London+NY':'LN+NY', 'New York':'NY' },
  SETUPS: ['Break & Retest','Support & Resistance'],

  MONTHS: ['January','February','March','April','May','June','July','August','September','October','November','December'],
  MONTHS_ABBR: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],

  // A scratch is measured in PRICE, not in dollars: an exit within this much of
  // the entry price went nowhere, whatever size was on. Read against P&L the
  // same band tightens as the account scales — $3 of P&L is $3 of gold at 0.01
  // lots and three cents of gold at 1.00 — so the rule would quietly mean
  // something different every time size changed.
  //
  // It changes the LABEL only. The dollars still flow into every money figure,
  // which keeps gross profit minus gross loss equal to net, and break-evens sit
  // in the win-rate denominator, so scratches drag it down rather than
  // vanishing.
  BE: 3,

  PER_PAGE: 10,
  // Supabase's default Max rows. A setting below it answers every page short,
  // which ends the load after the first.
  READ_PAGE: 1000,
  UNDO_MS: 7000,
  SNAPSHOT: 'doji_snapshot_v1'
});

/* ─── DOM ────────────────────────────────────────────────────────────────── */
const $ = id => document.getElementById(id);

const esc = s => String(s ?? '')
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/'/g,'&#39;');

// Null-safe: a renamed element should log rather than take the boot down.
const on = (id, event, fn) => {
  const el = typeof id === 'string' ? $(id) : id;
  if (el) el.addEventListener(event, fn);
  else console.warn(`Doji: no element for "${id}" (${event})`);
};

// One helper, so a surface cannot announce itself as a button and then ignore
// the keyboard.
const onActivate = (id, fn) => {
  on(id, 'click', fn);
  on(id, 'keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    e.preventDefault();
    fn(e);
  });
};

let notifTimer = 0;
function notify(msg, isError) {
  const el = $('notif');
  if (!el) return;
  // An Undo offer owns the toast for its whole window — overwriting it strands
  // PendingDelete's timer with no button left to cancel it, and there is no
  // other undelete path in the UI. An error still gets through: a silent
  // failure is worse than a lost undo.
  if (PendingDelete.id && !isError) return;
  el.textContent = msg;
  el.className = 'notif show' + (isError ? ' err' : '');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

function notifyUndo(msg) {
  const el = $('notif');
  if (!el) return;
  el.innerHTML = esc(msg) + '<button class="notif-undo" type="button">Undo</button>';
  el.className = 'notif show';
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => el.classList.remove('show'), CONFIG.UNDO_MS);
}

/* ─── DATES ──────────────────────────────────────────────────────────────────
   Everything with a market meaning resolves against New York wall time via Intl,
   so boundaries are identical on every device and correct across every
   daylight-saving shift. No civil date is read off the machine's own clock: a
   laptop on Pacific time would otherwise roll the day over three hours late and
   file a trade under yesterday.

   open_day is a DATE column, so a filing day needs no timezone reasoning — it is
   already the civil day.
   ─────────────────────────────────────────────────────────────────────────── */
const Dates = {
  // Local to each centre, read from its own clock rather than mapped onto New
  // York hours: London opens at 08:00 London time, which is 02:00, 03:00 or
  // 04:00 in New York depending on the week. A fixed NY table is silently an
  // hour wrong whenever US and UK daylight saving are misaligned.
  MARKETS: {
    sydney: { tz: 'Australia/Sydney',  open: 7, close: 16 },
    tokyo:  { tz: 'Asia/Tokyo',        open: 9, close: 18 },
    london: { tz: 'Europe/London',     open: 8, close: 17 },
    ny:     { tz: 'America/New_York',  open: 8, close: 17 }
  },

  // h23 rather than hour12, which can resolve to h24 and make midnight 24 — as
  // _shared/edge.ts and Eugenia's clock state it. It is also this file's browser
  // floor (Safari 14): an engine without hourCycle ignores it and falls back to
  // h12, and every session label and 17:00 boundary is silently wrong.
  //
  // Formatters held per zone: building one is the cost, using it is cheap, and
  // sessionBars asks thousands of times a render.
  HOUR_FMT: {},

  hourIn(tz, date) {
    const fmt = Dates.HOUR_FMT[tz] ??= new Intl.DateTimeFormat('en-US',
      { timeZone: tz, hour: '2-digit', hourCycle: 'h23' });
    return +fmt.formatToParts(date).find(p => p.type === 'hour').value;
  },

  isOpen(mkt, date) {
    const h = Dates.hourIn(mkt.tz, date);
    return h >= mkt.open && h < mkt.close;
  },

  // Which centres are open at once. Overlaps are the more specific case and
  // must be tested first. The dead stretch between the New York close and the
  // Sydney open folds into Asian, the session it precedes.
  session(date) {
    const M = Dates.MARKETS;
    const london = Dates.isOpen(M.london, date);
    const ny     = Dates.isOpen(M.ny, date);
    const asia   = Dates.isOpen(M.tokyo, date) || Dates.isOpen(M.sydney, date);
    if (london && ny)   return 'London+NY';
    if (london && asia) return 'Asia+London';
    if (london)         return 'London';
    if (ny)             return 'New York';
    return 'Asian';
  },

  // DST-correct. The one place weekday and hour are read, so every boundary
  // below agrees by construction.
  NY_FMT: null,

  nyParts(date) {
    const fmt = Dates.NY_FMT ??= new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', weekday: 'short',
