# Two ecosystems, and they do not carry the same weight.
#
# The Actions half is the one that matters, and not because the secrets are
# loose. SB_SECRET_KEY and SUPABASE_ACCESS_TOKEN are each scoped to the single
# step that needs them, so nothing else reads either directly. What an earlier
# action is handed instead is the toolchain: setup-node puts the `node` that
# runs scripts/backup-memory.mjs on PATH, and setup-cli installs the `supabase`
# the deploy step then hands its token to. A compromised action does not have
# to see a secret to reach one.
#
# The npm half is one dev dependency that never ships: index.html has no build
# step and its three libraries come from CDNs the graph cannot see. What it
# buys is not a CVE watch. test.yml is `on: [push]` and so runs on the bump
# branch, which means a jsdom release that moves innerHTML serialisation lands
# as a red golden.test.mjs on a pull request rather than on the afternoon the
# lock is refreshed for something else. NEVER answer that red with
# GOLDEN=write — the snapshot going red on a DOM change is the snapshot doing
# its job.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
