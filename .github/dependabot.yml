# The Actions half is the one that matters. Credentials are step-scoped, so an
# earlier action reaches the toolchain rather than a secret — setup-node puts the
# `node` that reads SB_SECRET_KEY on PATH. So every `uses:` is a commit SHA, and
# this file is what keeps the pins from going stale: it bumps the SHA and the
# `# vX.Y.Z` beside it together.
#
# The npm half is two dev dependencies that never ship. test.yml runs on the
# bump branch, so a jsdom or tsc release that changes what the suites see lands
# red on a pull request. NEVER answer a golden.test.mjs failure there with
# GOLDEN=write: the snapshot going red on a DOM change is the snapshot working.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
