name: test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The floor lives in package.json's engines.node and nowhere else.
          # A bare `node-version: 22` is a second home for it that no tool
          # compares: it resolves to the newest 22.x, which is above the floor
          # today and says nothing about the day the floor moves past it —
          # jsdom's requirement is what set it, and jsdom is a dependency that
          # moves. setup-node reads engines.node and resolves the range itself.
          node-version-file: package.json
      # ci, not install: it installs the lockfile exactly and fails if that
      # disagrees with package.json. A green run has to mean the tree someone
      # else gets, or "the suite passes" is a claim about one machine.
      - run: npm ci
      - run: npm test
