name: test
on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor lives in package.json's engines.node alone; a version
          # written here would be a second copy nothing compares.
          node-version-file: package.json
      # ci, not install: it installs the lockfile exactly and fails if that
      # disagrees with package.json. A green run has to mean the tree someone
      # else gets, or "the suite passes" is a claim about one machine.
      - run: npm ci
      - run: npm test

  # schema.sql on a real Postgres. Its own job, because it needs a server and
  # `npm test` needs Node alone. A named release rather than ubuntu-latest:
  # Postgres comes from PostgreSQL's own repository, which supports a new
  # Ubuntu only some time after GitHub moves the label onto it.
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suite re-runs schema.sql over main's copy, so it needs main.
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      # The major version Supabase runs, stated here alone: the suite reads it
      # back and refuses a server that is not it. The runner carries an older
      # Postgres, so 17 and pgvector come from PostgreSQL's own repository, which
      # its script adds. The runner creates no cluster on install, so the job
      # creates its own. PGCLUSTER points every client at it, and peer
      # authentication makes the runner's own user the superuser it connects as.
      - run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17 postgresql-17-pgvector
          sudo pg_createcluster --start 17 doji
          sudo -u postgres createuser --cluster 17/doji --superuser "$USER"
      - run: npm run test:db
        env:
          PGCLUSTER: 17/doji
