name: test
on: [push]

# Every other workflow reads the repository and nothing else, and so does this
# one: the default token can be write-scoped, and `npm ci` runs code from the
# registry with it in reach.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The step below compares the branch with main.
          fetch-depth: 0
          persist-credentials: false
      # A prompt change is run through the eval before and after, and the eval
      # spends money, so nothing runs it unasked: this says when it is owed. The
      # branch is compared with main, where a merge deploys, over what the eval
      # reads its prompts, its cases and its plants from; agree.test.mjs holds the
      # list. A step rather than a job of its own: a job is billed by the minute
      # rounded up, and the check takes a second. Before the suite, so a red
      # suite does not hide it.
      - run: |
          git diff --quiet "$(git merge-base HEAD origin/main)" HEAD -- supabase/functions/doji-eugenia/prompt.ts supabase/functions/doji-eugenia/strategy.ts test/fixtures/eval-cases.json scripts/eval.mjs ||
            echo "::warning title=The eval is owed::her prompts or the eval changed on this branch; run Actions, eval, on it before merging"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The floor lives in package.json's engines.node alone; a version
          # written here would be a second copy nothing compares.
          node-version-file: package.json
      # ci, not install: it installs the lockfile exactly and fails if that
      # disagrees with package.json. A green run has to mean the tree someone
      # else gets, or "the suite passes" is a claim about one machine.
      - run: npm ci
      - run: npm test

