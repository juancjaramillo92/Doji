# A copy of everything that exists nowhere else — his journal answers and
# Eugenia's memory — taken here with the secret key. Daily, after midnight in
# New York, so a lost day costs at most a day of answers. Off the hour, where
# GitHub's scheduler is least congested.
name: backup

on:
  schedule:
    - cron: '41 4 * * *'
  # The one that matters after a bad night: take a copy now, before repairing
  # anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor lives in package.json's engines.node alone; a version
          # written here would be a second copy nothing compares.
          node-version-file: package.json

      # No install step: the script is one file and uses fetch. A backup that
      # depends on a registry is a backup that fails the week the registry does.
      - name: Read the tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: node scripts/backup.mjs > backup.json

      # Fail loudly on an empty journal rather than uploading it. A backup that
      # ran, succeeded and holds nothing is worse than one that did not run: the
      # green tick is what stops anyone looking. `trades` is the table that is
      # never empty, so it is the one asked — a wrong project answers the other
      # tables with nothing just as readily.
      - name: Refuse an empty backup
        run: |
          rows=$(node -e "console.log(require('./backup.json').tables.trades.length)")
          echo "trades captured: $rows"
          test "$rows" -gt 0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: doji-backup-${{ github.run_id }}
          path: backup.json
          # The maximum a free account allows. Artifacts expire, so this is a
          # rolling window rather than an archive — download one occasionally
          # and keep it somewhere that does not.
          retention-days: 90
