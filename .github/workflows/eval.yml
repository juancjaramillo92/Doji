# Whether Eugenia still obeys her prompts, run by hand from the Actions tab:
# scripts/eval.mjs with --plant first, so a green run means the eval could
# have failed. It spends money on the Anthropic key — about fifty model calls
# — which is why nothing schedules it. The verdicts and the cost are in the
# run's log; a failed case fails the run. A case id asks that one case alone,
# without the plants, for cents: a recheck after a fix, never the green a
# prompt change is owed.
name: eval

on:
  workflow_dispatch:
    inputs:
      only:
        description: One case id to re-run alone, without the plants; empty for the full run
        default: ""

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor lives in package.json's engines.node alone; a version
          # written here would be a second copy nothing compares.
          node-version-file: package.json

      # No install step: the eval reads the prompts and calls the API by fetch.
      - name: Ask her real prompts the fixed cases, planted defects first
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            node --experimental-strip-types scripts/eval.mjs --only "$ONLY"
          else
            node --experimental-strip-types scripts/eval.mjs --plant
          fi
