# Whether Eugenia still obeys her prompts, run by hand from the Actions tab:
# scripts/eval.mjs with --plant first, so a green run means the eval could
# have failed. It spends money on the Anthropic key, which is why nothing
# schedules it. The verdicts and the cost are in the run's log; a failed case
# fails the run. A case id asks that one case alone, for cents: without the
# plants, a recheck after a fix; with them, the plants that break it first, the
# check a change to that one rule is owed.
name: eval

on:
  workflow_dispatch:
    inputs:
      only:
        description: One case id to run alone; empty for the full run
        default: ""
      plant:
        description: With a case id, run the plants that break it first
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The floor lives in package.json's engines.node alone; a version
          # written here would be a second copy nothing compares.
          node-version-file: package.json

      # No install step: the eval reads the prompts and calls the API by fetch.
      - name: Ask her real prompts the fixed cases, planted defects first
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
          PLANT: ${{ inputs.plant }}
        run: |
          if [ -n "$ONLY" ] && [ "$PLANT" = "true" ]; then
            node --experimental-strip-types scripts/eval.mjs --plant --only "$ONLY"
          elif [ -n "$ONLY" ]; then
            node --experimental-strip-types scripts/eval.mjs --only "$ONLY"
          else
            node --experimental-strip-types scripts/eval.mjs --plant
          fi
