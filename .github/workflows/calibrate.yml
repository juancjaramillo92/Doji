# Whether her map of his charts finds the levels he traded, and whether its
# marks hold, run by hand from the Actions tab: scripts/calibrate.mjs, which
# changes nothing. Here rather than on his computer, so running it is a
# button. Both tables are in the run's log.
name: calibrate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The floor lives in package.json's engines.node alone; a version
          # written here would be a second copy nothing compares.
          node-version-file: package.json

      # No install step: the script and the fold it imports use nothing but
      # fetch. The cron secret opens the poller's ?entries=1 and ?replay=N doors.
      - name: Fold her map at his newest entries and over past sessions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
          DOJI_CRON_SECRET: ${{ secrets.DOJI_CRON_SECRET }}
        run: node --experimental-strip-types scripts/calibrate.mjs
