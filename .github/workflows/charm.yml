# Builds the charm's firmware, the one program both boards run, and keeps it as
# a download: charm-full.bin, a single image written at 0x0 by any ESP flasher.
# Not charm.bin: that is ESP-IDF's name for the app alone, and merging onto it
# once wrote a 128 KB image with no app in it, from a green build.
# Espressif's own ESP-IDF image, pinned by digest like every action here by
# commit, so the toolchain that built a firmware is the one that will build it
# again. The board package and LVGL come from Espressif's component registry.
# A build of main is also published for the charm to update itself from: the
# app alone, charm.bin, to a public Storage bucket, its version the commit.
name: charm

on:
  push:
    paths:
      - 'charm/**'
      - '.github/workflows/charm.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: espressif/idf@sha256:b9f2d6ea1c19e0c9f7959bdb74a9e3c775642f9d0f3b841937c5fa3363db892b # v5.5.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        shell: bash
        working-directory: charm
        run: |
          # The commit, short enough for the app's 31-character version.
          export CHARM_VERSION="${GITHUB_SHA:0:12}"
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32s3
          idf.py build
          idf.py merge-bin -o charm-full.bin
      # The image must hold the app where the bootloader looks for it: the first
      # app slot, at 0x20000 (partitions.csv).
      - name: Check the image holds the app
        shell: bash
        working-directory: charm/build
        run: |
          app=$(stat -c %s charm.bin); full=$(stat -c %s charm-full.bin)
          echo "app $app bytes, full image $full bytes"
          test "$full" -ge $(( 0x20000 + app ))
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: charm-firmware
          path: charm/build/charm-full.bin
          if-no-files-found: error
      # The bucket is made on first use; a version the charm runs already is
      # one she downloads only the first bytes of.
      - name: Publish the update
        if: github.ref == 'refs/heads/main'
        shell: bash
        working-directory: charm/build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          curl -sf "$SUPABASE_URL/storage/v1/bucket/charm" -H "apikey: $SB_SECRET_KEY" > /dev/null ||
            curl -sf -X POST "$SUPABASE_URL/storage/v1/bucket" -H "apikey: $SB_SECRET_KEY" \
              -H "Content-Type: application/json" -d '{"id":"charm","name":"charm","public":true}'
          curl -sf -X POST "$SUPABASE_URL/storage/v1/object/charm/charm.bin" -H "apikey: $SB_SECRET_KEY" \
            -H "x-upsert: true" -H "Content-Type: application/octet-stream" --data-binary @charm.bin
