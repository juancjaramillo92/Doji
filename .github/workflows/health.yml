# Whether anything is running at all, asked from outside the database: every
# watcher inside it is a pg_cron job, so pg_cron stopping or the project
# pausing is the one failure none of them can report. Hourly, off the hour,
# where GitHub's scheduler is least congested. A failed run is the alarm —
# GitHub emails it.
name: health

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The floor lives in package.json's engines.node alone; a version
          # written here would be a second copy nothing compares.
          node-version-file: package.json

      # No install step, for the backup's reason. Strip-types, because the
      # threshold is imported from Eugenia's own file rather than copied.
      - name: Ask whether the poller is still completing runs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: node --experimental-strip-types scripts/health.mjs
