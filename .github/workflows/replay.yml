# What her calls would have done on past mornings, run by hand from the
# Actions tab: scripts/replay.mjs, which changes nothing. It spends money on
# the Anthropic key — one model call a weekday replayed — which is why
# nothing schedules it. The day-by-day table and the cost are in the run's log.
name: replay

on:
  workflow_dispatch:
    inputs:
      days:
        description: Weekdays back to replay, newest first
        default: "21"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The floor lives in package.json's engines.node alone; a version
          # written here would be a second copy nothing compares.
          node-version-file: package.json

      # No install step: the script and the folds it imports use nothing but
      # fetch. The cron secret opens the poller's ?replay=N door.
      - name: Ask her for the call she would have made, and score it
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DOJI_CRON_SECRET: ${{ secrets.DOJI_CRON_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAYS: ${{ inputs.days }}
        run: node --experimental-strip-types scripts/replay.mjs --days "$DAYS"
