# Deploys every Edge Function in supabase/functions on a push to main, so the
# repository is the source of truth for what is running — the same arrangement
# Vercel already gives index.html.
#
# Before this existed the functions were pasted into the dashboard by hand, and
# nothing connected the deployed code to the committed code. A repo that claims
# to describe a running system while the system runs something else is worse
# than no repo at all: every later change is reasoned about from a file that is
# not the truth.
name: deploy functions

on:
  push:
    branches: [main]
    # Only when the functions or this workflow actually change. A README edit
    # has no business redeploying anything.
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  # Manual re-run, for the first deploy and for re-pushing unchanged code after
  # a dashboard edit has been made by mistake.
  workflow_dispatch:

# Two pushes in quick succession must not race. Without this the older run can
# finish last and leave its functions live while both runs report green — the
# exact silent drift this workflow exists to prevent. Queued rather than
# cancelled: the last push to land is the one that must win.
concurrency:
  group: deploy-functions
  cancel-in-progress: false

# This job needs to read the repository and nothing else. The default token is
# write-scoped, and the account-scoped SUPABASE_ACCESS_TOKEN below already makes
# this the most privileged workflow here — there is no reason for a second
# credential in the same environment to be able to write anything.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false, so the checkout token is not left in
      # .git/config for the third-party steps that run after it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The floor lives in package.json's engines.node and nowhere else.
          # A bare `node-version: 22` is a second home for it that no tool
          # compares: it resolves to the newest 22.x, which is above the floor
          # today and says nothing about the day the floor moves past it —
          # jsdom's requirement is what set it, and jsdom is a dependency that
          # moves. setup-node reads engines.node and resolves the range itself.
          node-version-file: package.json

      # THE SUITE GATES THE DEPLOY, in this job rather than in a separate one.
      # test.yml runs on every push and would have gone red beside this
      # workflow while it shipped anyway — two green ticks and one red, with
      # the broken code already live. A failing step here stops the deploy,
      # which is the only ordering that actually protects anything. It is the
      # same suite; running it twice on a push to main costs seconds.
      - run: npm ci
      - run: npm test

      # `latest`, not a pin, and it is the one thing here deliberately not
      # pinned: the CLI talks to a platform that moves under it, so a pinned
      # version drifting out of step with the API is the likelier failure — and
      # it is Supabase's own tool authenticating to Supabase with a token that
      # is already theirs.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      # No function name: every function under supabase/functions goes, so one
      # of them cannot silently fall behind the others.
      #
      # --no-verify-jwt duplicates what supabase/config.toml already says, and
      # deliberately. All four functions authorise their own callers in code,
      # and if either mechanism stops being honoured on its own, a deploy that
      # quietly turned JWT verification back on would break the live Telegram
      # webhooks and the cron poller at once. Two statements of one setting is
      # the cheaper mistake.
      - run: supabase functions deploy --project-ref gujhyogvkzjgnrodyuse --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
