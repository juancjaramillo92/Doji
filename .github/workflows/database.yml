# schema.sql on a real Postgres. Its own workflow, because it needs a server
# and `npm test` needs Node alone, and because it is asked only of a push that
# touches what it reads: a job is billed by the minute rounded up, it ran on
# every push, and in October two pushes in three changed nothing it reads.
# agree.test.mjs derives what the suite reads and holds it against `paths`,
# so an input left off is a red test, not a green tick over a skipped check.
name: database
on:
  push:
    paths:
      - 'supabase/schema.sql'
      - 'supabase/upgrade.sql'
      - 'supabase/verify.sql'
      - 'test/db/**'
      - 'docs/README.md'
      - 'package.json'
      - '.github/workflows/database.yml'

permissions:
  contents: read

jobs:
  # A named release rather than ubuntu-latest: Postgres comes from
  # PostgreSQL's own repository, which supports a new Ubuntu only some time
  # after GitHub moves the label onto it.
  database:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The suite re-runs schema.sql over main's copy, so it needs main.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      # The major version Supabase runs, stated here alone: the suite reads it
      # back and refuses a server that is not it. The runner carries an older
      # Postgres, so 17 and pgvector come from PostgreSQL's own repository, which
      # its script adds. The runner creates no cluster on install, so the job
      # creates its own. PGCLUSTER points every client at it, and peer
      # authentication makes the runner's own user the superuser it connects as.
      - run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-17 postgresql-17-pgvector
          sudo pg_createcluster --start 17 doji
          sudo -u postgres createuser --cluster 17/doji --superuser "$USER"
      - run: npm run test:db
        env:
          PGCLUSTER: 17/doji
