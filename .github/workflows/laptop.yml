# Builds Eugenia's laptop app, the Mac app in laptop/, and keeps it as a
# download: Eugenia.zip, the app for Apple silicon. A build of main is also
# published for the app to update itself from, to a public Storage bucket, its
# version the commit — as the charm's firmware is.
#
# Signed with a certificate of its own, never Apple's: macOS keeps the
# microphone and screen permissions for an app whose signer is the same from
# one version to the next, and asks again for one whose signature is new each
# build — which an ad-hoc signature is. The first build makes the certificate
# and keeps it in a private bucket; every build after signs with that one.
name: laptop

on:
  push:
    paths:
      - 'laptop/**'
      - 'charm/art/eugenia.png'
      - 'icon-512.png'
      - '.github/workflows/laptop.yml'
  workflow_dispatch:

# Only a branch's newest build is the one anyone installs, and on main it is
# the order the update is published in.
concurrency:
  group: laptop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Build
        working-directory: laptop
        run: |
          npm ci
          # The commit, which the app compares with the version published beside it.
          echo "${GITHUB_SHA:0:12}" > build.txt
          # Her app wears Doji's icon, the one the phone has, made into the
          # sizes macOS asks for from the one copy of it. Nothing is made
          # larger than it is: the 1024 that would be its own double is left out.
          mkdir Eugenia.iconset
          for side in 16 32 128 256 512; do
            sips -z $side $side ../icon-512.png --out "Eugenia.iconset/icon_${side}x${side}.png" > /dev/null
            [ $side = 512 ] || sips -z $((side * 2)) $((side * 2)) ../icon-512.png --out "Eugenia.iconset/icon_${side}x${side}@2x.png" > /dev/null
          done
          iconutil -c icns Eugenia.iconset
          npm run package
      # The certificate is fetched, or made when there is none yet. Only an
      # answer that it is not there makes one: any other failure stops the
      # build rather than signing with a stranger, and the upload never
      # overwrites. Its password guards nothing the private bucket does not;
      # the bucket is read only with the secret key. A self-signed
      # certificate is not trusted, so it is named by its hash rather than
      # found by trust; codesign signs with it all the same.
      - name: Sign
        working-directory: laptop/out/Eugenia-darwin-arm64
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          p12="$RUNNER_TEMP/eugenia.p12"
          kept="$SUPABASE_URL/storage/v1/object/laptop-signing/Eugenia.p12"
          status=$(curl -s -o "$p12" -w '%{http_code}' "$kept" -H "apikey: $SB_SECRET_KEY")
          if [ "$status" = 400 ] || [ "$status" = 404 ]; then
            curl -sf "$SUPABASE_URL/storage/v1/bucket/laptop-signing" -H "apikey: $SB_SECRET_KEY" > /dev/null ||
              curl -sf -X POST "$SUPABASE_URL/storage/v1/bucket" -H "apikey: $SB_SECRET_KEY" \
                -H "Content-Type: application/json" -d '{"id":"laptop-signing","name":"laptop-signing","public":false}'
            /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj "/CN=Eugenia" \
              -addext "keyUsage=critical,digitalSignature" -addext "extendedKeyUsage=critical,codeSigning" \
              -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem"
            /usr/bin/openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
              -name Eugenia -out "$p12" -passout pass:eugenia
            curl -sf -X POST "$kept" -H "apikey: $SB_SECRET_KEY" \
              -H "Content-Type: application/x-pkcs12" --data-binary @"$p12"
          elif [ "$status" != 200 ]; then
            echo "the signing certificate could not be read (HTTP $status)"; exit 1
          fi
          keychain="$RUNNER_TEMP/eugenia.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "" "$keychain"
          security import "$p12" -k "$keychain" -P eugenia -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -p codesigning "$keychain" | awk '/\)/ { print $2; exit }')
          codesign --force --deep --sign "$identity" --keychain "$keychain" Eugenia.app
      - name: Check the signature and pack the app
        working-directory: laptop/out/Eugenia-darwin-arm64
        run: |
          codesign --verify --deep --strict Eugenia.app
          # The packager skips an icon it cannot find with only a warning.
          cmp ../../Eugenia.icns "Eugenia.app/Contents/Resources/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' Eugenia.app/Contents/Info.plist)"
          ditto -c -k --keepParent Eugenia.app Eugenia.zip
          ls -l Eugenia.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eugenia-laptop
          path: laptop/out/Eugenia-darwin-arm64/Eugenia.zip
          if-no-files-found: error
      # The bucket is made on first use, with room for an app of Electron's
      # size: the project's own upload limit must allow as much (README).
      - name: Publish the update
        if: github.ref == 'refs/heads/main'
        working-directory: laptop/out/Eugenia-darwin-arm64
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SB_SECRET_KEY: ${{ secrets.SB_SECRET_KEY }}
        run: |
          curl -sf "$SUPABASE_URL/storage/v1/bucket/laptop" -H "apikey: $SB_SECRET_KEY" > /dev/null ||
            curl -sf -X POST "$SUPABASE_URL/storage/v1/bucket" -H "apikey: $SB_SECRET_KEY" \
              -H "Content-Type: application/json" \
              -d '{"id":"laptop","name":"laptop","public":true,"file_size_limit":314572800}'
          curl -sf -X POST "$SUPABASE_URL/storage/v1/object/laptop/Eugenia.zip" -H "apikey: $SB_SECRET_KEY" \
            -H "x-upsert: true" -H "Content-Type: application/zip" --data-binary @Eugenia.zip
          # Its version beside it, after it, so it never names an app not yet there.
          printf '%s' "${GITHUB_SHA:0:12}" | curl -sf -X POST "$SUPABASE_URL/storage/v1/object/laptop/version" \
            -H "apikey: $SB_SECRET_KEY" -H "x-upsert: true" -H "Content-Type: text/plain" --data-binary @-
